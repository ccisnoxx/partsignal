openapi: 3.1.0
info:
  title: PartSignal API
  version: 0.1.1
  description: PartSignal MVP 契约。除登录外，写请求必须携带 X-CSRF-Token。
servers:
  - url: /
security:
  - sessionCookie: []
tags:
  - name: health
  - name: auth
  - name: identity
  - name: product-facts
  - name: planning
  - name: production
  - name: review
  - name: publication
  - name: observation
  - name: files
  - name: configuration
paths:
  /api/health/live:
    get:
      tags: [health]
      operationId: getLiveHealth
      security: []
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
  /api/health/ready:
    get:
      tags: [health]
      operationId: getReadyHealth
      security: []
      responses:
        '200':
          description: PostgreSQL 和 Redis 就绪
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: 登录成功并设置会话 Cookie
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSession'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      responses:
        '204': {description: 已撤销会话}
        '401': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '204': {description: 当前无会话}
        '401': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/auth/csrf:
    get:
      tags: [auth]
      operationId: getCsrfToken
      responses:
        '200':
          description: 当前会话 CSRF Token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CsrfToken'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/auth/change-password:
    post:
      tags: [auth]
      operationId: changePassword
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses:
        '204': {description: 密码已修改且其他会话已撤销}
        '401': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/users:
    get:
      tags: [identity]
      operationId: listUsers
      parameters:
        - {name: q, in: query, description: 按用户名或显示名称进行大小写不敏感的字面量包含搜索, schema: {type: string, maxLength: 200}}
        - {name: account_type, in: query, schema: {$ref: '#/components/schemas/AccountType'}}
        - {name: status, in: query, description: 省略时返回全部状态, schema: {$ref: '#/components/schemas/UserStatus'}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: 稳定分页的用户列表及不受筛选影响的全局实时摘要
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserList'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
    post:
      tags: [identity]
      operationId: createUser
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserCreate'}
      responses:
        '201':
          description: 已创建默认启用且首次登录必须修改临时密码的用户
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/users/bulk-status:
    post:
      tags: [identity]
      operationId: bulkUpdateUserStatus
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserBulkStatusRequest'}
      responses:
        '200':
          description: 合法批量命令的逐项成功与预期失败结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserBulkStatusResult'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/users/export:
    get:
      tags: [identity]
      operationId: exportUsers
      parameters:
        - {name: q, in: query, description: 按用户名或显示名称进行大小写不敏感的字面量包含搜索, schema: {type: string, maxLength: 200}}
        - {name: account_type, in: query, schema: {$ref: '#/components/schemas/AccountType'}}
        - {name: status, in: query, description: 省略时导出全部状态, schema: {$ref: '#/components/schemas/UserStatus'}}
      responses:
        '200':
          description: 当前筛选范围内、按用户列表稳定顺序生成的 UTF-8 BOM CSV
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            text/csv:
              schema: {type: string}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/users/{user_id}:
    patch:
      tags: [identity]
      operationId: updateUser
      parameters:
        - name: user_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserUpdate'}
      responses:
        '200':
          description: 已更新用户账号类型或启用状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
    delete:
      tags: [identity]
      operationId: deleteUser
      parameters:
        - name: user_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: '#/components/parameters/CsrfHeader'}
      responses:
        '204': {description: 已删除停用用户及其会话}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/users/{user_id}/reset-password:
    post:
      tags: [identity]
      operationId: resetUserPassword
      parameters:
        - name: user_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '204': {description: 已设置临时密码并撤销目标用户会话}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/audit-logs:
    get:
      tags: [identity]
      operationId: listAuditLogs
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {name: created_from, in: query, schema: {type: string, format: date-time}}
        - {name: created_to, in: query, schema: {type: string, format: date-time}}
        - {name: actor_id, in: query, schema: {type: string, format: uuid}}
        - {name: business_module, in: query, schema: {$ref: '#/components/schemas/AuditModule'}}
        - {name: action, in: query, schema: {type: string, maxLength: 120}}
        - {name: target_type, in: query, schema: {type: string}}
        - {name: target_id, in: query, schema: {type: string, maxLength: 100}}
        - {name: outcome, in: query, schema: {$ref: '#/components/schemas/AuditOutcome'}}
        - {name: request_id, in: query, schema: {type: string, maxLength: 100}}
        - {name: keyword, in: query, schema: {type: string, minLength: 1, maxLength: 100}}
      responses:
        '200':
          description: 追加式审计日志
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditLogList'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/audit-logs/filter-options:
    get:
      tags: [identity]
      operationId: getAuditLogFilterOptions
      responses:
        '200':
          description: 当前审计表中真实存在的动作和对象类型
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditLogFilterOptions'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/audit-logs/{audit_log_id}:
    get:
      tags: [identity]
      operationId: getAuditLog
      parameters:
        - name: audit_log_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: 只包含白名单摘要的审计详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditLogDetail'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/products:
    get:
      tags: [product-facts]
      operationId: listProducts
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {name: search, in: query, schema: {type: string, maxLength: 200}}
        - {name: sort, in: query, schema: {$ref: '#/components/schemas/ProductSort'}}
        - {name: fact_status, in: query, schema: {$ref: '#/components/schemas/ProductFactStatus'}}
        - {name: workflow_stage, in: query, schema: {$ref: '#/components/schemas/ProductWorkflowStage'}}
      responses:
        '200':
          description: 产品列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductList'}
    post:
      tags: [product-facts]
      operationId: createProduct
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductCreate'}
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/products/{product_id}:
    parameters: [{$ref: '#/components/parameters/ProductId'}]
    get:
      tags: [product-facts]
      operationId: getProduct
      responses:
        '200':
          description: 产品详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
    patch:
      tags: [product-facts]
      operationId: updateProduct
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductUpdate'}
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
    delete:
      tags: [product-facts]
      operationId: deleteProduct
      parameters:
        - {$ref: '#/components/parameters/ProductId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
        - {name: expected_revision, in: query, required: true, schema: {type: integer, minimum: 0}}
      responses:
        '204': {description: 已删除未被历史引用的产品及当前事实工作区}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/products/{product_id}/detail:
    parameters: [{$ref: '#/components/parameters/ProductId'}]
    get:
      tags: [product-facts]
      operationId: getProductDetail
      responses:
        '200':
          description: 单次请求可完整绘制的产品详情读模型
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductDetail'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/products/{product_id}/facts:
    parameters: [{$ref: '#/components/parameters/ProductId'}]
    get:
      tags: [product-facts]
      operationId: getProductFactsDraft
      responses:
        '200':
          description: 单次请求可完整绘制的当前事实工作区
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductFactsDraft'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
    put:
      tags: [product-facts]
      operationId: replaceProductFactsDraft
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductFactsDraftUpdate'}
      responses:
        '200':
          description: 已保存事实工作区
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductFactsDraft'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/products/{product_id}/fact-versions:
    parameters: [{$ref: '#/components/parameters/ProductId'}]
    get:
      tags: [product-facts]
      operationId: listFactVersions
      responses:
        '200':
          description: 事实版本
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FactVersionList'}
  /api/v1/products/{product_id}/fact-history:
    parameters: [{$ref: '#/components/parameters/ProductId'}]
    get:
      tags: [product-facts]
      operationId: listProductFactHistory
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, enum: [10, 20, 50], default: 20}
      responses:
        '200':
          description: 产品事实版本历史
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductFactHistoryList'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/products/{product_id}/fact-review-context:
    parameters: [{$ref: '#/components/parameters/ProductId'}]
    get:
      tags: [review]
      operationId: getProductFactReviewContext
      responses:
        '200':
          description: 单次请求可完整绘制的当前事实审核工作台
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductFactReviewWorkspace'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/products/{product_id}/fact-review-submissions:
    parameters: [{$ref: '#/components/parameters/ProductId'}]
    post:
      tags: [product-facts]
      operationId: submitProductFactReview
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FactReviewSubmissionRequest'}
      responses:
        '201':
          description: 已从事实工作区原子创建待审核快照
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FactVersion'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/fact-versions/{fact_version_id}:
    parameters: [{$ref: '#/components/parameters/FactVersionId'}]
    get:
      tags: [product-facts]
      operationId: getFactVersion
      responses:
        '200':
          description: 事实版本详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FactVersion'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
    delete:
      tags: [product-facts]
      operationId: deleteFactVersion
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      responses:
        '204': {description: 已删除事实版本及其从属审核记录}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/fact-versions/{fact_version_id}/review-context:
    get:
      tags: [review]
      operationId: getFactReviewContext
      parameters: [{$ref: '#/components/parameters/FactVersionId'}]
      responses:
        '200':
          description: 不可变事实快照与目标版本自身的完整审核历史
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FactReviewContext'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/fact-versions/{fact_version_id}/approve:
    post:
      tags: [review]
      operationId: approveFactVersion
      parameters:
        - {$ref: '#/components/parameters/FactVersionId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody: {$ref: '#/components/requestBodies/CommandRequest'}
      responses:
        '200': {$ref: '#/components/responses/FactVersionResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/fact-versions/{fact_version_id}/request-changes:
    post:
      tags: [review]
      operationId: requestFactVersionChanges
      parameters:
        - {$ref: '#/components/parameters/FactVersionId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody: {$ref: '#/components/requestBodies/RequestChangesCommand'}
      responses:
        '200': {$ref: '#/components/responses/FactVersionResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/fact-versions/{fact_version_id}/retire:
    post:
      tags: [review]
      operationId: retireFactVersion
      parameters:
        - {$ref: '#/components/parameters/FactVersionId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody: {$ref: '#/components/requestBodies/CommandRequest'}
      responses:
        '200': {$ref: '#/components/responses/FactVersionResponse'}
  /api/v1/query-topics:
    get:
      tags: [planning]
      operationId: listQueryTopics
      responses:
        '200':
          description: 目标问题列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueryTopicList'}
    post:
      tags: [planning]
      operationId: createQueryTopic
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QueryTopicCreate'}
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueryTopic'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/query-topics/list-items:
    get:
      tags: [planning]
      operationId: listQueryTopicItems
      parameters:
        - {name: q, in: query, schema: {type: string, minLength: 1, maxLength: 200}}
        - name: sort
          in: query
          schema:
            $ref: '#/components/schemas/QueryTopicListSort'
            default: QUESTION_ASC
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, enum: [10, 20, 50], default: 20}}
      responses:
        '200':
          description: Frontend V2 使用的 Query Topic 服务端搜索、排序与分页列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueryTopicListPage'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/query-topics/{query_topic_id}:
    patch:
      tags: [planning]
      operationId: updateQueryTopic
      parameters:
        - name: query_topic_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QueryTopicUpdate'}
      responses:
        '200':
          description: 已更新目标问题
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueryTopic'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
    delete:
      tags: [planning]
      operationId: deleteQueryTopic
      parameters:
        - name: query_topic_id
          in: path
          required: true
          schema: {type: string, format: uuid}
