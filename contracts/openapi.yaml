              schema: {$ref: '#/components/schemas/GeoMetrics'}
  /api/v1/dashboard/summary:
    get:
      tags: [observation]
      operationId: getDashboardSummary
      responses:
        '200':
          description: 需要行动的工作台摘要
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DashboardSummary'}
  /api/v1/files/upload-intents:
    post:
      tags: [files]
      operationId: createFileUploadIntent
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UploadIntentCreate'}
      responses:
        '201':
          description: 已创建限时上传意图
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadIntent'}
  /api/v1/files/{file_id}/complete:
    post:
      tags: [files]
      operationId: completeFileUpload
      parameters:
        - {$ref: '#/components/parameters/FileId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      responses:
        '200':
          description: HEAD 校验成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileRecord'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/files/{file_id}:
    get:
      tags: [files]
      operationId: getFileRecord
      parameters: [{$ref: '#/components/parameters/FileId'}]
      responses:
        '200':
          description: 文件元数据
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileRecord'}
  /api/v1/files/{file_id}/abort:
    post:
      tags: [files]
      operationId: abortFileUpload
      parameters:
        - {$ref: '#/components/parameters/FileId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      responses:
        '200':
          description: 已中止未完成上传
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileRecord'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/files/{file_id}/download-url:
    get:
      tags: [files]
      operationId: getFileDownloadUrl
      parameters: [{$ref: '#/components/parameters/FileId'}]
      responses:
        '200':
          description: 短期下载 URL
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignedUrl'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: partsignal_session
  parameters:
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string, minLength: 32}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: page_size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    ProductId: {name: product_id, in: path, required: true, schema: {type: string, format: uuid}}
    FactVersionId: {name: fact_version_id, in: path, required: true, schema: {type: string, format: uuid}}
    PlatformProfileId: {name: platform_profile_id, in: path, required: true, schema: {type: string, format: uuid}}
    PlatformProfileVersionId: {name: platform_profile_version_id, in: path, required: true, schema: {type: string, format: uuid}}
    PlatformTypeId: {name: platform_type_id, in: path, required: true, schema: {type: string, format: uuid}}
    AIChannelId: {name: channel_id, in: path, required: true, schema: {type: string, format: uuid}}
    AIChannelHeaderId: {name: header_id, in: path, required: true, schema: {type: string, format: uuid}}
    AIModelId: {name: model_id, in: path, required: true, schema: {type: string, format: uuid}}
    ContentTaskId: {name: content_task_id, in: path, required: true, schema: {type: string, format: uuid}}
    GenerationJobId: {name: generation_job_id, in: path, required: true, schema: {type: string, format: uuid}}
    ContentVersionId: {name: content_version_id, in: path, required: true, schema: {type: string, format: uuid}}
    PublicationId: {name: publication_id, in: path, required: true, schema: {type: string, format: uuid}}
    PublicationAttentionId: {name: attention_id, in: path, required: true, schema: {type: string, format: uuid}}
    FileId: {name: file_id, in: path, required: true, schema: {type: string, format: uuid}}
  requestBodies:
    CommandRequest:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CommandRequest'}
    RequestChangesCommand:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RequestChangesCommand'}
    RevisionRequest:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RevisionRequest'}
  responses:
    ErrorResponse:
      description: 业务或校验错误
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    FactVersionResponse:
      description: 更新后的事实版本
      content:
        application/json:
          schema: {$ref: '#/components/schemas/FactVersion'}
    ContentVersionResponse:
      description: 更新后的内容版本
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ContentVersion'}
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [ok]}
        checks: {type: object, additionalProperties: {type: string}}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: {$ref: '#/components/schemas/ErrorDetail'}
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code: {type: string}
        message: {type: string}
        details: {type: object, additionalProperties: true, default: {}}
        request_id: {type: string}
    PageInfo:
      type: object
      additionalProperties: false
      required: [page, page_size, total]
      properties:
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 1}
        password: {type: string, minLength: 8}
    AuthSession:
      type: object
      additionalProperties: false
      required: [user, csrf_token]
      properties:
        user: {$ref: '#/components/schemas/User'}
        csrf_token: {type: string}
    CsrfToken:
      type: object
      additionalProperties: false
      required: [csrf_token]
      properties:
        csrf_token: {type: string}
    AccountType:
      type: string
      enum: [ADMIN, ENGINEER]
    User:
      type: object
      additionalProperties: false
      required: [id, username, display_name, account_type, is_active, must_change_password, revision, created_at]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        display_name: {type: string}
        account_type: {$ref: '#/components/schemas/AccountType'}
        is_active: {type: boolean}
        must_change_password: {type: boolean}
        revision: {type: integer}
        created_at: {type: string, format: date-time}
    UserCreate:
      type: object
      additionalProperties: false
      required: [username, display_name, password, account_type]
      properties:
        username: {type: string, minLength: 3}
        display_name: {type: string, minLength: 1}
        password: {type: string, minLength: 12}
        account_type: {$ref: '#/components/schemas/AccountType'}
    UserUpdate:
      type: object
      additionalProperties: false
      required: [expected_revision, display_name, account_type, is_active]
      properties:
        expected_revision: {type: integer, minimum: 0}
        display_name: {type: string, minLength: 1}
        account_type: {$ref: '#/components/schemas/AccountType'}
        is_active: {type: boolean}
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [temporary_password]
      properties:
        temporary_password: {type: string, minLength: 12}
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [old_password, new_password]
      properties:
        old_password: {type: string, minLength: 8}
        new_password: {type: string, minLength: 12}
    UserList:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/User'}}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer}
    AuditLog:
      type: object
      additionalProperties: false
      required: [id, actor_id, action, target_type, target_id, change_summary, request_id, created_at]
      properties:
        id: {type: string, format: uuid}
        actor_id: {type: string, format: uuid}
        action: {type: string}
        target_type: {type: string}
        target_id: {type: string, format: uuid}
        change_summary: {type: object, additionalProperties: true}
        request_id: {type: string}
        created_at: {type: string, format: date-time}
    AuditLogList:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AuditLog'}}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer}
    ProductStatus: {type: string, enum: [ACTIVE, RETIRED]}
    Product:
      type: object
      additionalProperties: false
      required: [id, part_number, brand, category, status, revision, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        part_number: {type: string}
        brand: {type: string}
        category: {type: string}
        status: {$ref: '#/components/schemas/ProductStatus'}
        revision: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ProductCreate:
      type: object
      additionalProperties: false
      required: [part_number, brand, category]
      properties:
        part_number: {type: string, minLength: 1}
        brand: {type: string, minLength: 1}
        category: {type: string, minLength: 1}
    ProductUpdate:
      type: object
      additionalProperties: false
      required: [expected_revision, part_number, brand, category, status]
      properties:
        expected_revision: {type: integer, minimum: 0}
        part_number: {type: string}
        brand: {type: string}
        category: {type: string}
        status: {$ref: '#/components/schemas/ProductStatus'}
    ProductList:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Product'}}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer}
    ReferencePart:
      type: object
      additionalProperties: false
      required: [client_key, part_number, manufacturer, category]
      properties:
        client_key: {type: string}
        part_number: {type: string}
        manufacturer: {type: string}
        category: {type: string}
    ParameterValueType: {type: string, enum: [NUMERIC, RANGE, TEXT]}
    PartParameter:
      type: object
      additionalProperties: false
      required: [client_key, owner_key, key, name, value_type, unit, test_conditions, is_critical, evidence_keys]
      properties:
        client_key: {type: string}
        owner_key: {type: string, description: product 或 ReferencePart.client_key}
        key: {type: string}
        name: {type: string}
        value_type: {$ref: '#/components/schemas/ParameterValueType'}
        min_value: {type: [number, 'null']}
        typical_value: {type: [number, 'null']}
        max_value: {type: [number, 'null']}
        text_value: {type: [string, 'null']}
        unit: {type: string}
        test_conditions: {type: string}
        is_critical: {type: boolean}
        evidence_keys: {type: array, items: {type: string}, uniqueItems: true}
    ReplacementLevel:
      type: string
      enum: [FUNCTIONALLY_SIMILAR, PARAMETER_COMPATIBLE, PIN_COMPATIBLE, PIN_TO_PIN, PROTOTYPE_VALIDATED, TEMPERATURE_VALIDATED, MASS_PRODUCTION_VALIDATED]
    ReplacementRelation:
      type: object
      additionalProperties: false
      required: [client_key, reference_part_key, replacement_level, conditions, exclusions, evidence_keys]
      properties:
        client_key: {type: string}
        reference_part_key: {type: string}
        replacement_level: {$ref: '#/components/schemas/ReplacementLevel'}
        conditions: {type: string, minLength: 1}
        exclusions: {type: string, minLength: 1}
        evidence_keys: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
    EvidenceType: {type: string, enum: [DATASHEET, TEST_REPORT, APPLICATION_NOTE, CUSTOMER_AUTHORIZATION, OTHER]}
    Confidentiality: {type: string, enum: [PUBLIC, INTERNAL, RESTRICTED]}
    Evidence:
      type: object
      additionalProperties: false
      required: [client_key, type, title, version, confidentiality]
      properties:
        client_key: {type: string}
        type: {$ref: '#/components/schemas/EvidenceType'}
        title: {type: string}
        version: {type: string}
        source_url: {type: [string, 'null'], format: uri, minLength: 1, maxLength: 2083}
        file_id: {type: [string, 'null'], format: uuid}
        confidentiality: {$ref: '#/components/schemas/Confidentiality'}
    ClaimType: {type: string, enum: [APPROVED, PROHIBITED, REQUIRED_DISCLOSURE]}
    FactClaim:
      type: object
      additionalProperties: false
      required: [client_key, type, text, evidence_keys]
      properties:
        client_key: {type: string}
        type: {$ref: '#/components/schemas/ClaimType'}
        text: {type: string, minLength: 1}
        evidence_keys: {type: array, items: {type: string}, uniqueItems: true}
    ProductFactsBody:
      type: object
      additionalProperties: false
      required: [reference_parts, parameters, replacement_relations, evidences, claims]
      properties:
        reference_parts: {type: array, items: {$ref: '#/components/schemas/ReferencePart'}}
        parameters: {type: array, items: {$ref: '#/components/schemas/PartParameter'}}
        replacement_relations: {type: array, items: {$ref: '#/components/schemas/ReplacementRelation'}}
        evidences: {type: array, items: {$ref: '#/components/schemas/Evidence'}}
        claims: {type: array, items: {$ref: '#/components/schemas/FactClaim'}}
    ProductFactsDraftUpdate:
      allOf:
        - {$ref: '#/components/schemas/ProductFactsBody'}
        - type: object
          required: [expected_revision]
          properties:
            expected_revision: {type: integer, minimum: 0}
    ProductFactsDraft:
      allOf:
        - {$ref: '#/components/schemas/ProductFactsBody'}
        - type: object
          required: [product_id, revision]
          properties:
            product_id: {type: string, format: uuid}
            revision: {type: integer}
    FactVersionStatus: {type: string, enum: [DRAFT, PENDING_REVIEW, CHANGES_REQUESTED, APPROVED, RETIRED]}
    CreateVersionRequest:
      type: object
      additionalProperties: false
      required: [change_summary]
      properties:
        change_summary: {type: string, minLength: 1}
    CommandRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, comment]
      properties:
        expected_revision: {type: integer, minimum: 0}
        comment: {type: string}
    RequestChangesCommand:
      type: object
      additionalProperties: false
      required: [expected_revision, comment]
      properties:
        expected_revision: {type: integer, minimum: 0}
        comment: {type: string, minLength: 1}
    RevisionRequest:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision: {type: integer, minimum: 0}
    FactVersion:
      type: object
      additionalProperties: false
      required: [id, product_id, version, status, snapshot, change_summary, revision, created_by, created_at]
      properties:
        id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        version: {type: integer}
        status: {$ref: '#/components/schemas/FactVersionStatus'}
        snapshot: {$ref: '#/components/schemas/ProductFactsBody'}
        change_summary: {type: string}
        revision: {type: integer}
        created_by: {type: string, format: uuid}
        approved_by: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        approved_at: {type: [string, 'null'], format: date-time}
    FactVersionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/FactVersion'}}
    IntentType: {type: string, enum: [BRAND, PRODUCT, REPLACEMENT, COMPARISON, APPLICATION, TROUBLESHOOTING]}
    QueryTopicCreate:
      type: object
      additionalProperties: false
      required: [canonical_question, intent_type, variants]
      properties:
        canonical_question: {type: string, minLength: 1}
        intent_type: {$ref: '#/components/schemas/IntentType'}
        variants: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
    QueryTopicUpdate:
      type: object
      additionalProperties: false
      required: [expected_revision, canonical_question, intent_type, variants]
      properties:
        expected_revision: {type: integer, minimum: 0}
        canonical_question: {type: string, minLength: 1}
        intent_type: {$ref: '#/components/schemas/IntentType'}
        variants: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
    QueryTopic:
      allOf:
        - {$ref: '#/components/schemas/QueryTopicCreate'}
        - type: object
          required: [id, revision, created_at]
          properties:
            id: {type: string, format: uuid}
            revision: {type: integer}
            created_at: {type: string, format: date-time}
    QueryTopicList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/QueryTopic'}}
    PlatformProfileCreate:
      type: object
      additionalProperties: false
      required: [name, slug, allowed_domains, platform_type_id]
      properties:
        name: {type: string}
        slug: {type: string, pattern: '^[a-z0-9-]+$'}
        allowed_domains: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
        platform_type_id: {type: string, format: uuid}
        website_url: {type: [string, 'null'], format: uri, minLength: 1, maxLength: 2083}
        logo:
          anyOf:
            - {$ref: '#/components/schemas/PlatformLogoInput'}
            - {type: 'null'}
    PlatformProfileUpdate:
      type: object
      additionalProperties: false
      required: [expected_revision, name, allowed_domains, platform_type_id, website_url, logo]
      properties:
        expected_revision: {type: integer, minimum: 0}
        name: {type: string, minLength: 1}
        allowed_domains: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
        platform_type_id: {type: string, format: uuid}
        website_url: {type: [string, 'null'], format: uri, minLength: 1, maxLength: 2083}
        logo:
          anyOf:
            - {$ref: '#/components/schemas/PlatformLogoInput'}
            - {type: 'null'}
    PlatformLogoUploadInput:
      type: object
      additionalProperties: false
      required: [source, file_id]
      properties:
        source: {type: string, const: UPLOAD}
        file_id: {type: string, format: uuid}
    PlatformLogoExternalInput:
      type: object
      additionalProperties: false
      required: [source, url]
      properties:
        source: {type: string, const: EXTERNAL}
        url: {type: string, format: uri, minLength: 1, maxLength: 2083}
    PlatformLogoInput:
      oneOf:
        - {$ref: '#/components/schemas/PlatformLogoUploadInput'}
        - {$ref: '#/components/schemas/PlatformLogoExternalInput'}
      discriminator:
        propertyName: source
        mapping:
          UPLOAD: '#/components/schemas/PlatformLogoUploadInput'
          EXTERNAL: '#/components/schemas/PlatformLogoExternalInput'
    PlatformLogoUpload:
      allOf:
        - {$ref: '#/components/schemas/PlatformLogoUploadInput'}
        - type: object
          required: [url]
          properties:
            url: {type: string, format: uri, minLength: 1, maxLength: 2083}
    PlatformLogoExternal:
      type: object
      additionalProperties: false
      required: [source, url]
      properties:
        source: {type: string, const: EXTERNAL}
        url: {type: string, format: uri, minLength: 1, maxLength: 2083}
    PlatformLogo:
      oneOf:
        - {$ref: '#/components/schemas/PlatformLogoUpload'}
        - {$ref: '#/components/schemas/PlatformLogoExternal'}
      discriminator:
        propertyName: source
        mapping:
          UPLOAD: '#/components/schemas/PlatformLogoUpload'
          EXTERNAL: '#/components/schemas/PlatformLogoExternal'
    PlatformProfileVersionCreate:
      type: object
      additionalProperties: false
      required: [rules]
      properties:
        rules: {$ref: '#/components/schemas/PlatformRules'}
    PlatformProfileVersionUpdate:
      type: object
      additionalProperties: false
      required: [expected_revision, rules]
      properties:
        expected_revision: {type: integer, minimum: 0}
        rules: {$ref: '#/components/schemas/PlatformRules'}
    PlatformRules:
      type: object
      additionalProperties: false
      required: [target_audience, title_min, title_max, body_min, body_max, tone, allow_external_links, allow_tables, allow_contact, prohibited_phrases, sections]
      properties:
        target_audience: {type: string}
        title_min: {type: integer, minimum: 1}
        title_max: {type: integer, minimum: 1}
        body_min: {type: integer, minimum: 1}
        body_max: {type: integer, minimum: 1}
        tone: {type: string}
        allow_external_links: {type: boolean}
        allow_tables: {type: boolean}
        allow_contact: {type: boolean}
        prohibited_phrases: {type: array, items: {type: string}}
        sections: {type: array, items: {$ref: '#/components/schemas/PlatformSection'}}
    PlatformSection:
      type: object
      additionalProperties: false
      required: [name, url]
      properties:
        name: {type: string}
        url: {type: string, format: uri, minLength: 1, maxLength: 2083}
    PlatformProfileVersion:
      type: object
      additionalProperties: false
      required: [id, platform_profile_id, version, status, rules, revision, created_at]
      properties:
        id: {type: string, format: uuid}
        platform_profile_id: {type: string, format: uuid}
        version: {type: integer}
        status: {type: string, enum: [DRAFT, ACTIVE, RETIRED]}
        rules: {$ref: '#/components/schemas/PlatformRules'}
        revision: {type: integer}
        created_at: {type: string, format: date-time}
    PlatformProfileVersionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PlatformProfileVersion'}}
    PlatformProfile:
      type: object
      additionalProperties: false
      required: [id, name, slug, allowed_domains, platform_type_id, website_url, logo, revision, active_version, prompt_configured]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string}
        allowed_domains: {type: array, items: {type: string}}
        platform_type_id: {type: [string, 'null'], format: uuid}
        website_url: {type: [string, 'null'], format: uri, minLength: 1, maxLength: 2083}
        logo:
          anyOf:
            - {$ref: '#/components/schemas/PlatformLogo'}
            - {type: 'null'}
        revision: {type: integer}
        active_version:
          anyOf:
            - {$ref: '#/components/schemas/PlatformProfileVersion'}
            - {type: 'null'}
        prompt_configured: {type: boolean}
    PlatformProfileList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PlatformProfile'}}
    PlatformTypeCreate:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: {type: string, minLength: 1}
        slug: {type: string, pattern: '^[a-z0-9-]+$'}
    PlatformTypeUpdate:
      type: object
      additionalProperties: false
      required: [expected_revision, name, slug]
      properties:
        expected_revision: {type: integer, minimum: 0}
        name: {type: string, minLength: 1}
        slug: {type: string, pattern: '^[a-z0-9-]+$'}
    PlatformType:
      type: object
      additionalProperties: false
      required: [id, name, slug, revision, created_by, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
