openapi: 3.1.0
info:
  title: PartSignal API
  version: 0.1.1
  description: PartSignal MVP 契约。除登录外，写请求必须携带 X-CSRF-Token。
servers:
  - url: /
security:
  - sessionCookie: []
tags:
  - name: health
  - name: auth
  - name: identity
  - name: product-facts
  - name: planning
  - name: production
  - name: review
  - name: publication
  - name: observation
  - name: files
paths:
  /api/health/live:
    get:
      tags: [health]
      operationId: getLiveHealth
      security: []
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
  /api/health/ready:
    get:
      tags: [health]
      operationId: getReadyHealth
      security: []
      responses:
        '200':
          description: PostgreSQL 和 Redis 就绪
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: 登录成功并设置会话 Cookie
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSession'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      responses:
        '204': {description: 已撤销会话}
        '401': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/auth/csrf:
    get:
      tags: [auth]
      operationId: getCsrfToken
      responses:
        '200':
          description: 当前会话 CSRF Token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CsrfToken'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/users:
    get:
      tags: [identity]
      operationId: listUsers
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserList'}
    post:
      tags: [identity]
      operationId: createUser
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserCreate'}
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/users/{user_id}:
    patch:
      tags: [identity]
      operationId: updateUser
      parameters:
        - name: user_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserUpdate'}
      responses:
        '200':
          description: 已更新用户角色或启用状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/audit-logs:
    get:
      tags: [identity]
      operationId: listAuditLogs
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {name: target_type, in: query, schema: {type: string}}
        - {name: target_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: 追加式审计日志
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditLogList'}
  /api/v1/products:
    get:
      tags: [product-facts]
      operationId: listProducts
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {name: search, in: query, schema: {type: string}}
      responses:
        '200':
          description: 产品列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductList'}
    post:
      tags: [product-facts]
      operationId: createProduct
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductCreate'}
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
  /api/v1/products/{product_id}:
    parameters: [{$ref: '#/components/parameters/ProductId'}]
    get:
      tags: [product-facts]
      operationId: getProduct
      responses:
        '200':
          description: 产品详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
    patch:
      tags: [product-facts]
      operationId: updateProduct
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductUpdate'}
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/products/{product_id}/facts:
    parameters: [{$ref: '#/components/parameters/ProductId'}]
    get:
      tags: [product-facts]
      operationId: getProductFactsDraft
      responses:
        '200':
          description: 当前事实工作区
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductFactsDraft'}
    put:
      tags: [product-facts]
      operationId: replaceProductFactsDraft
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductFactsDraftUpdate'}
      responses:
        '200':
          description: 已保存事实工作区
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductFactsDraft'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/products/{product_id}/fact-versions:
    parameters: [{$ref: '#/components/parameters/ProductId'}]
    get:
      tags: [product-facts]
      operationId: listFactVersions
      responses:
        '200':
          description: 事实版本
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FactVersionList'}
    post:
      tags: [product-facts]
      operationId: createFactVersion
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateVersionRequest'}
      responses:
        '201':
          description: 已从工作区创建不可变快照
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FactVersion'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/fact-versions/{fact_version_id}:
    parameters: [{$ref: '#/components/parameters/FactVersionId'}]
    get:
      tags: [product-facts]
      operationId: getFactVersion
      responses:
        '200':
          description: 事实版本详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FactVersion'}
  /api/v1/fact-versions/{fact_version_id}/submit:
    post:
      tags: [review]
      operationId: submitFactVersion
      parameters:
        - {$ref: '#/components/parameters/FactVersionId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody: {$ref: '#/components/requestBodies/CommandRequest'}
      responses:
        '200': {$ref: '#/components/responses/FactVersionResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/fact-versions/{fact_version_id}/approve:
    post:
      tags: [review]
      operationId: approveFactVersion
      parameters:
        - {$ref: '#/components/parameters/FactVersionId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody: {$ref: '#/components/requestBodies/CommandRequest'}
      responses:
        '200': {$ref: '#/components/responses/FactVersionResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/fact-versions/{fact_version_id}/request-changes:
    post:
      tags: [review]
      operationId: requestFactVersionChanges
      parameters:
        - {$ref: '#/components/parameters/FactVersionId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody: {$ref: '#/components/requestBodies/CommandRequest'}
      responses:
        '200': {$ref: '#/components/responses/FactVersionResponse'}
  /api/v1/fact-versions/{fact_version_id}/retire:
    post:
      tags: [review]
      operationId: retireFactVersion
      parameters:
        - {$ref: '#/components/parameters/FactVersionId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody: {$ref: '#/components/requestBodies/CommandRequest'}
      responses:
        '200': {$ref: '#/components/responses/FactVersionResponse'}
  /api/v1/query-topics:
    get:
      tags: [planning]
      operationId: listQueryTopics
      responses:
        '200':
          description: 目标问题列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueryTopicList'}
    post:
      tags: [planning]
      operationId: createQueryTopic
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QueryTopicCreate'}
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueryTopic'}
  /api/v1/query-topics/{query_topic_id}:
    patch:
      tags: [planning]
      operationId: updateQueryTopic
      parameters:
        - name: query_topic_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QueryTopicUpdate'}
      responses:
        '200':
          description: 已更新目标问题
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueryTopic'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/platform-profiles:
    get:
      tags: [planning]
      operationId: listPlatformProfiles
      responses:
        '200':
          description: 平台配置列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformProfileList'}
    post:
      tags: [planning]
      operationId: createPlatformProfile
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlatformProfileCreate'}
      responses:
        '201':
          description: 已创建平台和首个 ACTIVE 版本
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformProfile'}
  /api/v1/platform-profiles/{platform_profile_id}/versions:
    get:
      tags: [planning]
      operationId: listPlatformProfileVersions
      parameters: [{$ref: '#/components/parameters/PlatformProfileId'}]
      responses:
        '200':
          description: 平台全部规则版本
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformProfileVersionList'}
    post:
      tags: [planning]
      operationId: createPlatformProfileVersion
      parameters:
        - {$ref: '#/components/parameters/PlatformProfileId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlatformProfileVersionCreate'}
      responses:
        '201':
          description: 已创建 DRAFT 配置版本
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformProfileVersion'}
  /api/v1/platform-profile-versions/{platform_profile_version_id}/activate:
    post:
      tags: [planning]
      operationId: activatePlatformProfileVersion
      parameters:
        - {$ref: '#/components/parameters/PlatformProfileVersionId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody: {$ref: '#/components/requestBodies/CommandRequest'}
      responses:
        '200':
          description: 已激活并停用上一 ACTIVE 版本
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformProfileVersion'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/platform-profile-versions/{platform_profile_version_id}/retire:
    post:
      tags: [planning]
      operationId: retirePlatformProfileVersion
      parameters:
        - {$ref: '#/components/parameters/PlatformProfileVersionId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody: {$ref: '#/components/requestBodies/CommandRequest'}
      responses:
        '200':
          description: 已停用平台配置版本
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformProfileVersion'}
  /api/v1/content-tasks:
    get:
      tags: [planning]
      operationId: listContentTasks
      responses:
        '200':
          description: 内容任务列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentTaskList'}
    post:
      tags: [planning]
      operationId: createContentTask
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContentTaskCreate'}
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentTask'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/content-tasks/{content_task_id}:
    parameters: [{$ref: '#/components/parameters/ContentTaskId'}]
    get:
      tags: [planning]
      operationId: getContentTask
      responses:
        '200':
          description: 内容任务详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentTask'}
  /api/v1/content-tasks/{content_task_id}/complete:
    post:
      tags: [planning]
      operationId: completeContentTask
      parameters:
        - {$ref: '#/components/parameters/ContentTaskId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody: {$ref: '#/components/requestBodies/CommandRequest'}
      responses:
        '200':
          description: 已完成内容任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentTask'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/content-tasks/{content_task_id}/cancel:
    post:
      tags: [planning]
      operationId: cancelContentTask
      parameters:
        - {$ref: '#/components/parameters/ContentTaskId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody: {$ref: '#/components/requestBodies/CommandRequest'}
      responses:
        '200':
          description: 已取消内容任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentTask'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/content-tasks/{content_task_id}/generation-jobs:
    get:
      tags: [production]
      operationId: listGenerationJobs
      parameters: [{$ref: '#/components/parameters/ContentTaskId'}]
      responses:
        '200':
          description: 任务的全部生成作业
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenerationJobList'}
    post:
      tags: [production]
      operationId: createGenerationJob
      parameters:
        - {$ref: '#/components/parameters/ContentTaskId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202':
          description: 已创建或返回幂等作业
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenerationJob'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/content-tasks/{content_task_id}/content-versions:
    get:
      tags: [production]
      operationId: listContentTaskVersions
      parameters: [{$ref: '#/components/parameters/ContentTaskId'}]
      responses:
        '200':
          description: 任务的全部内容版本
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentVersionList'}
  /api/v1/generation-jobs/{generation_job_id}:
    get:
      tags: [production]
      operationId: getGenerationJob
      parameters: [{$ref: '#/components/parameters/GenerationJobId'}]
      responses:
        '200':
          description: 生成作业
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenerationJob'}
  /api/v1/generation-jobs/{generation_job_id}/retry:
    post:
      tags: [production]
      operationId: retryGenerationJob
      parameters:
        - {$ref: '#/components/parameters/GenerationJobId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202':
          description: 已创建重试作业
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenerationJob'}
  /api/v1/content-versions/{content_version_id}:
    get:
      tags: [production]
      operationId: getContentVersion
      parameters: [{$ref: '#/components/parameters/ContentVersionId'}]
      responses:
        '200':
          description: 内容版本
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentVersion'}
  /api/v1/content-versions/{content_version_id}/revisions:
    post:
      tags: [production]
      operationId: createContentRevision
      parameters:
        - {$ref: '#/components/parameters/ContentVersionId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContentRevisionCreate'}
      responses:
        '201':
          description: 已创建新版本
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentVersion'}
  /api/v1/content-versions/{content_version_id}/submit-review:
    post:
      tags: [review]
      operationId: submitContentVersion
      parameters:
        - {$ref: '#/components/parameters/ContentVersionId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody: {$ref: '#/components/requestBodies/CommandRequest'}
      responses:
        '200': {$ref: '#/components/responses/ContentVersionResponse'}
  /api/v1/content-versions/{content_version_id}/approve:
    post:
      tags: [review]
      operationId: approveContentVersion
      parameters:
        - {$ref: '#/components/parameters/ContentVersionId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody: {$ref: '#/components/requestBodies/CommandRequest'}
      responses:
        '200': {$ref: '#/components/responses/ContentVersionResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/content-versions/{content_version_id}/request-changes:
    post:
      tags: [review]
      operationId: requestContentVersionChanges
      parameters:
        - {$ref: '#/components/parameters/ContentVersionId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody: {$ref: '#/components/requestBodies/CommandRequest'}
      responses:
        '200': {$ref: '#/components/responses/ContentVersionResponse'}
  /api/v1/content-versions/{content_version_id}/compare/{other_version_id}:
    get:
      tags: [review]
      operationId: compareContentVersions
      parameters:
        - {$ref: '#/components/parameters/ContentVersionId'}
        - name: other_version_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Markdown 行级差异
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentDiff'}
  /api/v1/content-versions/{content_version_id}/publication-package:
    get:
      tags: [publication]
      operationId: getPublicationPackage
      parameters: [{$ref: '#/components/parameters/ContentVersionId'}]
      responses:
        '200':
          description: 由批准 Markdown 派生的人工发布包
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationPackage'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/publication-candidates:
    get:
      tags: [publication]
      operationId: listPublicationCandidates
      responses:
        '200':
          description: 可人工发布的批准内容
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentVersionList'}
  /api/v1/platform-accounts:
    get:
      tags: [publication]
      operationId: listPlatformAccounts
      responses:
        '200':
          description: 平台账号标识
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformAccountList'}
    post:
      tags: [publication]
      operationId: createPlatformAccount
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlatformAccountCreate'}
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformAccount'}
  /api/v1/publication-records/manual:
    post:
      tags: [publication]
      operationId: createManualPublication
      parameters:
        - {$ref: '#/components/parameters/CsrfHeader'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ManualPublicationCreate'}
      responses:
        '201':
          description: 已创建人工发布记录
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationRecord'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/publication-records:
    get:
      tags: [publication]
      operationId: listPublicationRecords
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/PublicationStatus'}}
      responses:
        '200':
          description: 发布记录列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationRecordList'}
  /api/v1/publication-records/{publication_id}:
    get:
      tags: [publication]
      operationId: getPublicationRecord
      parameters: [{$ref: '#/components/parameters/PublicationId'}]
      responses:
        '200':
          description: 发布记录
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationRecord'}
  /api/v1/publication-records/{publication_id}/{command}:
    post:
      tags: [publication]
      operationId: commandPublicationRecord
      parameters:
        - {$ref: '#/components/parameters/PublicationId'}
        - name: command
          in: path
          required: true
          schema:
            type: string
            enum: [mark-platform-review, mark-published, verify, reject, remove, mark-verification-failed]
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublicationCommand'}
      responses:
        '200':
          description: 已执行状态命令
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationRecord'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/geo-observations:
    get:
      tags: [observation]
      operationId: listGeoObservations
      responses:
        '200':
          description: 观测列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GeoObservationList'}
    post:
      tags: [observation]
      operationId: createGeoObservation
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GeoObservationCreate'}
      responses:
        '201':
          description: 已追加观测
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GeoObservation'}
  /api/v1/geo-metrics:
    get:
      tags: [observation]
      operationId: getGeoMetrics
      parameters:
        - {name: product_id, in: query, schema: {type: string, format: uuid}}
        - {name: query_topic_id, in: query, schema: {type: string, format: uuid}}
        - {name: model_name, in: query, schema: {type: string}}
        - {name: date_from, in: query, schema: {type: string, format: date}}
        - {name: date_to, in: query, schema: {type: string, format: date}}
      responses:
        '200':
          description: 基础 GEO 指标
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GeoMetrics'}
  /api/v1/dashboard/summary:
    get:
      tags: [observation]
      operationId: getDashboardSummary
      responses:
        '200':
          description: 需要行动的工作台摘要
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DashboardSummary'}
  /api/v1/files/upload-intents:
    post:
      tags: [files]
      operationId: createFileUploadIntent
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UploadIntentCreate'}
      responses:
        '201':
          description: 已创建限时上传意图
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadIntent'}
  /api/v1/files/{file_id}/complete:
    post:
      tags: [files]
      operationId: completeFileUpload
      parameters:
        - {$ref: '#/components/parameters/FileId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      responses:
        '200':
          description: HEAD 校验成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileRecord'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/files/{file_id}:
    get:
      tags: [files]
      operationId: getFileRecord
      parameters: [{$ref: '#/components/parameters/FileId'}]
      responses:
        '200':
          description: 文件元数据
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileRecord'}
  /api/v1/files/{file_id}/abort:
    post:
      tags: [files]
      operationId: abortFileUpload
      parameters:
        - {$ref: '#/components/parameters/FileId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      responses:
        '200':
          description: 已中止未完成上传
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileRecord'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/files/{file_id}/download-url:
    get:
      tags: [files]
      operationId: getFileDownloadUrl
      parameters: [{$ref: '#/components/parameters/FileId'}]
      responses:
        '200':
          description: 短期下载 URL
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignedUrl'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: partsignal_session
  parameters:
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string, minLength: 32}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: page_size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    ProductId: {name: product_id, in: path, required: true, schema: {type: string, format: uuid}}
    FactVersionId: {name: fact_version_id, in: path, required: true, schema: {type: string, format: uuid}}
    PlatformProfileId: {name: platform_profile_id, in: path, required: true, schema: {type: string, format: uuid}}
    PlatformProfileVersionId: {name: platform_profile_version_id, in: path, required: true, schema: {type: string, format: uuid}}
    ContentTaskId: {name: content_task_id, in: path, required: true, schema: {type: string, format: uuid}}
    GenerationJobId: {name: generation_job_id, in: path, required: true, schema: {type: string, format: uuid}}
    ContentVersionId: {name: content_version_id, in: path, required: true, schema: {type: string, format: uuid}}
    PublicationId: {name: publication_id, in: path, required: true, schema: {type: string, format: uuid}}
    FileId: {name: file_id, in: path, required: true, schema: {type: string, format: uuid}}
  requestBodies:
    CommandRequest:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CommandRequest'}
  responses:
    ErrorResponse:
      description: 业务或校验错误
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    FactVersionResponse:
      description: 更新后的事实版本
      content:
        application/json:
          schema: {$ref: '#/components/schemas/FactVersion'}
    ContentVersionResponse:
      description: 更新后的内容版本
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ContentVersion'}
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [ok]}
        checks: {type: object, additionalProperties: {type: string}}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: {$ref: '#/components/schemas/ErrorDetail'}
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code: {type: string}
        message: {type: string}
        details: {type: object, additionalProperties: true, default: {}}
        request_id: {type: string}
    PageInfo:
      type: object
      additionalProperties: false
      required: [page, page_size, total]
      properties:
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 1}
        password: {type: string, minLength: 8}
    AuthSession:
      type: object
      additionalProperties: false
      required: [user, csrf_token]
      properties:
        user: {$ref: '#/components/schemas/User'}
        csrf_token: {type: string}
    CsrfToken:
      type: object
      additionalProperties: false
      required: [csrf_token]
      properties:
        csrf_token: {type: string}
    Role:
      type: string
      enum: [SYSTEM_ADMIN, PRODUCT_EDITOR, PRODUCT_REVIEWER, CONTENT_EDITOR, CONTENT_REVIEWER, ANALYST]
    User:
      type: object
      additionalProperties: false
      required: [id, username, display_name, roles, is_active, revision, created_at]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        display_name: {type: string}
        roles: {type: array, items: {$ref: '#/components/schemas/Role'}}
        is_active: {type: boolean}
        revision: {type: integer}
        created_at: {type: string, format: date-time}
    UserCreate:
      type: object
      additionalProperties: false
      required: [username, display_name, password, roles]
      properties:
        username: {type: string, minLength: 3}
        display_name: {type: string, minLength: 1}
        password: {type: string, minLength: 12}
        roles: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/Role'}}
    UserUpdate:
      type: object
      additionalProperties: false
      required: [expected_revision, display_name, roles, is_active]
      properties:
        expected_revision: {type: integer, minimum: 0}
        display_name: {type: string, minLength: 1}
        roles: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/Role'}}
        is_active: {type: boolean}
    UserList:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/User'}}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer}
    AuditLog:
      type: object
      additionalProperties: false
      required: [id, actor_id, action, target_type, target_id, change_summary, request_id, created_at]
      properties:
        id: {type: string, format: uuid}
        actor_id: {type: string, format: uuid}
        action: {type: string}
        target_type: {type: string}
        target_id: {type: string, format: uuid}
        change_summary: {type: object, additionalProperties: true}
        request_id: {type: string}
        created_at: {type: string, format: date-time}
    AuditLogList:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AuditLog'}}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer}
    ProductStatus: {type: string, enum: [ACTIVE, RETIRED]}
    Product:
      type: object
      additionalProperties: false
      required: [id, part_number, brand, category, status, revision, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        part_number: {type: string}
        brand: {type: string}
        category: {type: string}
        status: {$ref: '#/components/schemas/ProductStatus'}
        revision: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ProductCreate:
      type: object
      additionalProperties: false
      required: [part_number, brand, category]
      properties:
        part_number: {type: string, minLength: 1}
        brand: {type: string, minLength: 1}
        category: {type: string, minLength: 1}
    ProductUpdate:
      type: object
      additionalProperties: false
      required: [expected_revision, part_number, brand, category, status]
      properties:
        expected_revision: {type: integer, minimum: 0}
        part_number: {type: string}
        brand: {type: string}
        category: {type: string}
        status: {$ref: '#/components/schemas/ProductStatus'}
    ProductList:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Product'}}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer}
    ReferencePart:
      type: object
      additionalProperties: false
      required: [client_key, part_number, manufacturer, category]
      properties:
        client_key: {type: string}
        part_number: {type: string}
        manufacturer: {type: string}
        category: {type: string}
    ParameterValueType: {type: string, enum: [NUMERIC, RANGE, TEXT]}
    PartParameter:
      type: object
      additionalProperties: false
      required: [client_key, owner_key, key, name, value_type, unit, test_conditions, is_critical, evidence_keys]
      properties:
        client_key: {type: string}
        owner_key: {type: string, description: product 或 ReferencePart.client_key}
        key: {type: string}
        name: {type: string}
        value_type: {$ref: '#/components/schemas/ParameterValueType'}
        min_value: {type: [number, 'null']}
        typical_value: {type: [number, 'null']}
        max_value: {type: [number, 'null']}
        text_value: {type: [string, 'null']}
        unit: {type: string}
        test_conditions: {type: string}
        is_critical: {type: boolean}
        evidence_keys: {type: array, items: {type: string}, uniqueItems: true}
    ReplacementLevel:
      type: string
      enum: [FUNCTIONALLY_SIMILAR, PARAMETER_COMPATIBLE, PIN_COMPATIBLE, PIN_TO_PIN, PROTOTYPE_VALIDATED, TEMPERATURE_VALIDATED, MASS_PRODUCTION_VALIDATED]
    ReplacementRelation:
      type: object
      additionalProperties: false
      required: [client_key, reference_part_key, replacement_level, conditions, exclusions, evidence_keys]
      properties:
        client_key: {type: string}
        reference_part_key: {type: string}
        replacement_level: {$ref: '#/components/schemas/ReplacementLevel'}
        conditions: {type: string, minLength: 1}
        exclusions: {type: string, minLength: 1}
        evidence_keys: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
    EvidenceType: {type: string, enum: [DATASHEET, TEST_REPORT, APPLICATION_NOTE, CUSTOMER_AUTHORIZATION, OTHER]}
    Confidentiality: {type: string, enum: [PUBLIC, INTERNAL, RESTRICTED]}
    Evidence:
      type: object
      additionalProperties: false
      required: [client_key, type, title, version, confidentiality]
      properties:
        client_key: {type: string}
        type: {$ref: '#/components/schemas/EvidenceType'}
        title: {type: string}
        version: {type: string}
        source_url: {type: [string, 'null'], format: uri, minLength: 1, maxLength: 2083}
        file_id: {type: [string, 'null'], format: uuid}
        confidentiality: {$ref: '#/components/schemas/Confidentiality'}
    ClaimType: {type: string, enum: [APPROVED, PROHIBITED, REQUIRED_DISCLOSURE]}
    FactClaim:
      type: object
      additionalProperties: false
      required: [client_key, type, text, evidence_keys]
      properties:
        client_key: {type: string}
        type: {$ref: '#/components/schemas/ClaimType'}
        text: {type: string, minLength: 1}
        evidence_keys: {type: array, items: {type: string}, uniqueItems: true}
    ProductFactsBody:
      type: object
      additionalProperties: false
      required: [reference_parts, parameters, replacement_relations, evidences, claims]
      properties:
        reference_parts: {type: array, items: {$ref: '#/components/schemas/ReferencePart'}}
        parameters: {type: array, items: {$ref: '#/components/schemas/PartParameter'}}
        replacement_relations: {type: array, items: {$ref: '#/components/schemas/ReplacementRelation'}}
        evidences: {type: array, items: {$ref: '#/components/schemas/Evidence'}}
        claims: {type: array, items: {$ref: '#/components/schemas/FactClaim'}}
    ProductFactsDraftUpdate:
      allOf:
        - {$ref: '#/components/schemas/ProductFactsBody'}
        - type: object
          required: [expected_revision]
          properties:
            expected_revision: {type: integer, minimum: 0}
    ProductFactsDraft:
      allOf:
        - {$ref: '#/components/schemas/ProductFactsBody'}
        - type: object
          required: [product_id, revision]
          properties:
            product_id: {type: string, format: uuid}
            revision: {type: integer}
    FactVersionStatus: {type: string, enum: [DRAFT, PENDING_REVIEW, CHANGES_REQUESTED, APPROVED, RETIRED]}
    CreateVersionRequest:
      type: object
      additionalProperties: false
      required: [change_summary]
      properties:
        change_summary: {type: string, minLength: 1}
    CommandRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, comment]
      properties:
        expected_revision: {type: integer, minimum: 0}
        comment: {type: string}
    FactVersion:
      type: object
      additionalProperties: false
      required: [id, product_id, version, status, snapshot, change_summary, revision, created_by, created_at]
      properties:
        id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        version: {type: integer}
        status: {$ref: '#/components/schemas/FactVersionStatus'}
        snapshot: {$ref: '#/components/schemas/ProductFactsBody'}
        change_summary: {type: string}
        revision: {type: integer}
        created_by: {type: string, format: uuid}
        approved_by: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        approved_at: {type: [string, 'null'], format: date-time}
    FactVersionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/FactVersion'}}
    IntentType: {type: string, enum: [BRAND, PRODUCT, REPLACEMENT, COMPARISON, APPLICATION, TROUBLESHOOTING]}
    QueryTopicCreate:
      type: object
      additionalProperties: false
      required: [canonical_question, intent_type, variants]
      properties:
        canonical_question: {type: string, minLength: 1}
        intent_type: {$ref: '#/components/schemas/IntentType'}
        variants: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
    QueryTopicUpdate:
      type: object
      additionalProperties: false
      required: [expected_revision, canonical_question, intent_type, variants]
      properties:
        expected_revision: {type: integer, minimum: 0}
        canonical_question: {type: string, minLength: 1}
        intent_type: {$ref: '#/components/schemas/IntentType'}
        variants: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
    QueryTopic:
      allOf:
        - {$ref: '#/components/schemas/QueryTopicCreate'}
        - type: object
          required: [id, revision, created_at]
          properties:
            id: {type: string, format: uuid}
            revision: {type: integer}
            created_at: {type: string, format: date-time}
    QueryTopicList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/QueryTopic'}}
    PlatformProfileCreate:
      type: object
      additionalProperties: false
      required: [name, slug, allowed_domains, rules]
      properties:
        name: {type: string}
        slug: {type: string, pattern: '^[a-z0-9-]+$'}
        allowed_domains: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
        rules: {$ref: '#/components/schemas/PlatformRules'}
    PlatformProfileVersionCreate:
      type: object
      additionalProperties: false
      required: [rules]
      properties:
        rules: {$ref: '#/components/schemas/PlatformRules'}
    PlatformRules:
      type: object
      additionalProperties: false
      required: [target_audience, title_min, title_max, body_min, body_max, tone, allow_external_links, allow_tables, allow_contact, prohibited_phrases, sections]
      properties:
        target_audience: {type: string}
        title_min: {type: integer, minimum: 1}
        title_max: {type: integer, minimum: 1}
        body_min: {type: integer, minimum: 1}
        body_max: {type: integer, minimum: 1}
        tone: {type: string}
        allow_external_links: {type: boolean}
        allow_tables: {type: boolean}
        allow_contact: {type: boolean}
        prohibited_phrases: {type: array, items: {type: string}}
        sections: {type: array, items: {$ref: '#/components/schemas/PlatformSection'}}
    PlatformSection:
      type: object
      additionalProperties: false
      required: [name, url]
      properties:
        name: {type: string}
        url: {type: string, format: uri, minLength: 1, maxLength: 2083}
    PlatformProfileVersion:
      type: object
      additionalProperties: false
      required: [id, version, status, rules, revision, created_at]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer}
        status: {type: string, enum: [DRAFT, ACTIVE, RETIRED]}
        rules: {$ref: '#/components/schemas/PlatformRules'}
        revision: {type: integer}
        created_at: {type: string, format: date-time}
    PlatformProfileVersionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PlatformProfileVersion'}}
    PlatformProfile:
      type: object
      additionalProperties: false
      required: [id, name, slug, allowed_domains, active_version]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string}
        allowed_domains: {type: array, items: {type: string}}
        active_version: {$ref: '#/components/schemas/PlatformProfileVersion'}
    PlatformProfileList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PlatformProfile'}}
    ContentTaskStatus: {type: string, enum: [OPEN, COMPLETED, CANCELLED]}
    ContentTaskCreate:
      type: object
      additionalProperties: false
      required: [query_topic_id, product_id, fact_version_id, platform_profile_version_id, target_audience, content_angle, conversion_goal, desired_format, desired_length_min, desired_length_max, canonical_url]
      properties:
        query_topic_id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        fact_version_id: {type: string, format: uuid}
        platform_profile_version_id: {type: string, format: uuid}
        target_audience: {type: string}
        content_angle: {type: string}
        conversion_goal: {type: string}
        desired_format: {type: string}
        desired_length_min: {type: integer, minimum: 1}
        desired_length_max: {type: integer, minimum: 1}
        canonical_url: {type: string, format: uri, minLength: 1, maxLength: 2083}
    ContentTask:
      allOf:
        - {$ref: '#/components/schemas/ContentTaskCreate'}
        - type: object
          required: [id, status, revision, created_by, created_at]
          properties:
            id: {type: string, format: uuid}
            status: {$ref: '#/components/schemas/ContentTaskStatus'}
            revision: {type: integer}
            created_by: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
    ContentTaskList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ContentTask'}}
    GenerationJobStatus: {type: string, enum: [PENDING, RUNNING, SUCCEEDED, FAILED]}
    GenerationJob:
      type: object
      additionalProperties: false
      required: [id, content_task_id, status, attempt_count, created_at]
      properties:
        id: {type: string, format: uuid}
        content_task_id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/GenerationJobStatus'}
        attempt_count: {type: integer}
        content_version_id: {type: [string, 'null'], format: uuid}
        retry_of_id: {type: [string, 'null'], format: uuid}
        error_code: {type: [string, 'null']}
        error_summary: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
    GenerationJobList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/GenerationJob'}}
    ContentVersionStatus: {type: string, enum: [DRAFT, PENDING_REVIEW, CHANGES_REQUESTED, APPROVED, SUPERSEDED]}
    QualityIssue:
      type: object
      additionalProperties: false
      required: [code, severity, message]
      properties:
        code: {type: string}
        severity: {type: string, enum: [WARNING, BLOCKING]}
        message: {type: string}
    ContentVersion:
      type: object
      additionalProperties: false
      required: [id, task_id, fact_version_id, version, source_type, title, summary, body_markdown, tags, content_hash, status, revision, quality_issues, created_by, created_at]
      properties:
        id: {type: string, format: uuid}
        task_id: {type: string, format: uuid}
        fact_version_id: {type: string, format: uuid}
        version: {type: integer}
        source_type: {type: string, enum: [AI, HUMAN]}
        title: {type: string}
        summary: {type: string}
        body_markdown: {type: string}
        tags: {type: array, items: {type: string}}
        used_fact_ids: {type: array, items: {type: string}}
        used_evidence_ids: {type: array, items: {type: string}}
        content_hash: {type: string}
        status: {$ref: '#/components/schemas/ContentVersionStatus'}
        revision: {type: integer}
        quality_issues: {type: array, items: {$ref: '#/components/schemas/QualityIssue'}}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
    ContentRevisionCreate:
