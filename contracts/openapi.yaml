openapi: 3.1.0
info:
  title: PartSignal API
  version: 0.1.1
  description: PartSignal MVP 契约。除登录外，写请求必须携带 X-CSRF-Token。
servers:
  - url: /
security:
  - sessionCookie: []
tags:
  - name: health
  - name: auth
  - name: identity
  - name: product-facts
  - name: planning
  - name: production
  - name: review
  - name: publication
  - name: observation
  - name: files
  - name: configuration
paths:
  /api/health/live:
    get:
      tags: [health]
      operationId: getLiveHealth
      security: []
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
  /api/health/ready:
    get:
      tags: [health]
      operationId: getReadyHealth
      security: []
      responses:
        '200':
          description: PostgreSQL 和 Redis 就绪
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: 登录成功并设置会话 Cookie
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSession'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      responses:
        '204': {description: 已撤销会话}
        '401': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/auth/csrf:
    get:
      tags: [auth]
      operationId: getCsrfToken
      responses:
        '200':
          description: 当前会话 CSRF Token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CsrfToken'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/auth/change-password:
    post:
      tags: [auth]
      operationId: changePassword
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses:
        '204': {description: 密码已修改且其他会话已撤销}
        '401': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/users:
    get:
      tags: [identity]
      operationId: listUsers
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserList'}
    post:
      tags: [identity]
      operationId: createUser
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserCreate'}
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/users/{user_id}:
    patch:
      tags: [identity]
      operationId: updateUser
      parameters:
        - name: user_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserUpdate'}
      responses:
        '200':
          description: 已更新用户账号类型或启用状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/users/{user_id}/reset-password:
    post:
      tags: [identity]
      operationId: resetUserPassword
      parameters:
        - name: user_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '204': {description: 已设置临时密码并撤销目标用户会话}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/audit-logs:
    get:
      tags: [identity]
      operationId: listAuditLogs
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {name: target_type, in: query, schema: {type: string}}
        - {name: target_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: 追加式审计日志
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditLogList'}
  /api/v1/products:
    get:
      tags: [product-facts]
      operationId: listProducts
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {name: search, in: query, schema: {type: string}}
      responses:
        '200':
          description: 产品列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductList'}
    post:
      tags: [product-facts]
      operationId: createProduct
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductCreate'}
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
  /api/v1/products/{product_id}:
    parameters: [{$ref: '#/components/parameters/ProductId'}]
    get:
      tags: [product-facts]
      operationId: getProduct
      responses:
        '200':
          description: 产品详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
    patch:
      tags: [product-facts]
      operationId: updateProduct
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductUpdate'}
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
    delete:
      tags: [product-facts]
      operationId: deleteProduct
      parameters:
        - {$ref: '#/components/parameters/ProductId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      responses:
        '204': {description: 已删除未被历史引用的产品及当前事实工作区}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/products/{product_id}/facts:
    parameters: [{$ref: '#/components/parameters/ProductId'}]
    get:
      tags: [product-facts]
      operationId: getProductFactsDraft
      responses:
        '200':
          description: 当前事实工作区
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductFactsDraft'}
    put:
      tags: [product-facts]
      operationId: replaceProductFactsDraft
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductFactsDraftUpdate'}
      responses:
        '200':
          description: 已保存事实工作区
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductFactsDraft'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/products/{product_id}/fact-versions:
    parameters: [{$ref: '#/components/parameters/ProductId'}]
    get:
      tags: [product-facts]
      operationId: listFactVersions
      responses:
        '200':
          description: 事实版本
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FactVersionList'}
    post:
      tags: [product-facts]
      operationId: createFactVersion
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateVersionRequest'}
      responses:
        '201':
          description: 已从工作区创建不可变快照
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FactVersion'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/fact-versions/{fact_version_id}:
    parameters: [{$ref: '#/components/parameters/FactVersionId'}]
    get:
      tags: [product-facts]
      operationId: getFactVersion
      responses:
        '200':
          description: 事实版本详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FactVersion'}
    delete:
      tags: [product-facts]
      operationId: deleteFactVersion
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      responses:
        '204': {description: 已删除事实版本及其从属审核记录}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/fact-versions/{fact_version_id}/review-context:
    get:
      tags: [review]
      operationId: getFactReviewContext
      parameters: [{$ref: '#/components/parameters/FactVersionId'}]
      responses:
        '200':
          description: 不可变事实快照与完整审核历史
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FactReviewContext'}
  /api/v1/fact-versions/{fact_version_id}/submit:
    post:
      tags: [review]
      operationId: submitFactVersion
      parameters:
        - {$ref: '#/components/parameters/FactVersionId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody: {$ref: '#/components/requestBodies/CommandRequest'}
      responses:
        '200': {$ref: '#/components/responses/FactVersionResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/fact-versions/{fact_version_id}/approve:
    post:
      tags: [review]
      operationId: approveFactVersion
      parameters:
        - {$ref: '#/components/parameters/FactVersionId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody: {$ref: '#/components/requestBodies/CommandRequest'}
      responses:
        '200': {$ref: '#/components/responses/FactVersionResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/fact-versions/{fact_version_id}/request-changes:
    post:
      tags: [review]
      operationId: requestFactVersionChanges
      parameters:
        - {$ref: '#/components/parameters/FactVersionId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody: {$ref: '#/components/requestBodies/RequestChangesCommand'}
      responses:
        '200': {$ref: '#/components/responses/FactVersionResponse'}
  /api/v1/fact-versions/{fact_version_id}/retire:
    post:
      tags: [review]
      operationId: retireFactVersion
      parameters:
        - {$ref: '#/components/parameters/FactVersionId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody: {$ref: '#/components/requestBodies/CommandRequest'}
      responses:
        '200': {$ref: '#/components/responses/FactVersionResponse'}
  /api/v1/query-topics:
    get:
      tags: [planning]
      operationId: listQueryTopics
      responses:
        '200':
          description: 目标问题列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueryTopicList'}
    post:
      tags: [planning]
      operationId: createQueryTopic
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QueryTopicCreate'}
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueryTopic'}
  /api/v1/query-topics/{query_topic_id}:
    patch:
      tags: [planning]
      operationId: updateQueryTopic
      parameters:
        - name: query_topic_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QueryTopicUpdate'}
      responses:
        '200':
          description: 已更新目标问题
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueryTopic'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/platform-profiles:
    get:
      tags: [planning]
      operationId: listPlatformProfiles
      responses:
        '200':
          description: 平台配置列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformProfileList'}
    post:
      tags: [planning]
      operationId: createPlatformProfile
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlatformProfileCreate'}
      responses:
        '201':
          description: 已创建平台，当前规则为空
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformProfile'}
  /api/v1/platform-profile-versions:
    get:
      tags: [planning]
      operationId: listAllPlatformProfileVersions
      responses:
        '200':
          description: 全部平台规则版本
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformProfileVersionList'}
  /api/v1/platform-profiles/{platform_profile_id}/versions:
    get:
      tags: [planning]
      operationId: listPlatformProfileVersions
      parameters: [{$ref: '#/components/parameters/PlatformProfileId'}]
      responses:
        '200':
          description: 平台全部规则版本
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformProfileVersionList'}
    post:
      tags: [planning]
      operationId: createPlatformProfileVersion
      parameters:
        - {$ref: '#/components/parameters/PlatformProfileId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlatformProfileVersionCreate'}
      responses:
        '201':
          description: 已创建 DRAFT 配置版本
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformProfileVersion'}
  /api/v1/platform-profile-versions/{platform_profile_version_id}/activate:
    post:
      tags: [planning]
      operationId: activatePlatformProfileVersion
      parameters:
        - {$ref: '#/components/parameters/PlatformProfileVersionId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody: {$ref: '#/components/requestBodies/CommandRequest'}
      responses:
        '200':
          description: 已激活并停用上一 ACTIVE 版本
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformProfileVersion'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/platform-profile-versions/{platform_profile_version_id}/retire:
    post:
      tags: [planning]
      operationId: retirePlatformProfileVersion
      parameters:
        - {$ref: '#/components/parameters/PlatformProfileVersionId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody: {$ref: '#/components/requestBodies/CommandRequest'}
      responses:
        '200':
          description: 已停用平台配置版本
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformProfileVersion'}
  /api/v1/platform-profiles/{platform_profile_id}:
    patch:
      tags: [configuration]
      operationId: updatePlatformProfile
      parameters:
        - {$ref: '#/components/parameters/PlatformProfileId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlatformProfileUpdate'}
      responses:
        '200':
          description: 已更新平台身份或类型归属
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformProfile'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
    delete:
      tags: [configuration]
      operationId: deletePlatformProfile
      parameters:
        - {$ref: '#/components/parameters/PlatformProfileId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      responses:
        '204': {description: 已删除未被规则版本或平台账号引用的平台}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/platform-profile-versions/{platform_profile_version_id}:
    patch:
      tags: [planning]
      operationId: updatePlatformProfileVersion
      parameters:
        - {$ref: '#/components/parameters/PlatformProfileVersionId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlatformProfileVersionUpdate'}
      responses:
        '200':
          description: 已更新 DRAFT 平台规则版本
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformProfileVersion'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
    delete:
      tags: [configuration]
      operationId: deletePlatformProfileVersion
      parameters:
        - {$ref: '#/components/parameters/PlatformProfileVersionId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      responses:
        '204': {description: 已删除未被内容任务引用的平台规则版本}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/platform-profiles/{platform_profile_id}/prompt:
    get:
      tags: [configuration]
      operationId: getPlatformPrompt
      parameters: [{$ref: '#/components/parameters/PlatformProfileId'}]
      responses:
        '200':
          description: 当前平台 Prompt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformPrompt'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
    put:
      tags: [configuration]
      operationId: putPlatformPrompt
      parameters:
        - {$ref: '#/components/parameters/PlatformProfileId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlatformPromptPut'}
      responses:
        '200':
          description: 已创建或原地更新当前 Prompt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformPrompt'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
    delete:
      tags: [configuration]
      operationId: deletePlatformPrompt
      parameters:
        - {$ref: '#/components/parameters/PlatformProfileId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      responses:
        '204': {description: 已删除当前 Prompt}
  /api/v1/content-humanization-prompt:
    get:
      tags: [configuration]
      operationId: getContentHumanizationPrompt
      responses:
        '200':
          description: 当前全局自然化 Prompt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentHumanizationPrompt'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
    put:
      tags: [configuration]
      operationId: putContentHumanizationPrompt
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContentHumanizationPromptPut'}
      responses:
        '200':
          description: 已首次创建或按修订号更新自然化 Prompt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentHumanizationPrompt'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/platform-types:
    get:
      tags: [configuration]
      operationId: listPlatformTypes
      responses:
        '200':
          description: 平台类型列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformTypeList'}
    post:
      tags: [configuration]
      operationId: createPlatformType
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlatformTypeCreate'}
      responses:
        '201':
          description: 已创建平台类型
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformType'}
  /api/v1/platform-types/{platform_type_id}:
    patch:
      tags: [configuration]
      operationId: updatePlatformType
      parameters:
        - {$ref: '#/components/parameters/PlatformTypeId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlatformTypeUpdate'}
      responses:
        '200':
          description: 已更新平台类型
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformType'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
    delete:
      tags: [configuration]
      operationId: deletePlatformType
      parameters:
        - {$ref: '#/components/parameters/PlatformTypeId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      responses:
        '204': {description: 已删除未被引用的平台类型}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/ai-channels:
    get:
      tags: [configuration]
      operationId: listAIChannels
      responses:
        '200':
          description: AI 渠道列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AIChannelList'}
    post:
      tags: [configuration]
      operationId: createAIChannel
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AIChannelCreate'}
      responses:
        '201':
          description: 已创建默认停用的渠道
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AIChannel'}
  /api/v1/ai-channels/{channel_id}:
    get:
      tags: [configuration]
      operationId: getAIChannel
      parameters: [{$ref: '#/components/parameters/AIChannelId'}]
      responses:
        '200':
          description: 渠道详情和非敏感 Header
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AIChannel'}
    patch:
      tags: [configuration]
      operationId: updateAIChannel
      parameters:
        - {$ref: '#/components/parameters/AIChannelId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AIChannelUpdate'}
      responses:
        '200':
          description: 已更新渠道，连接变化会重置测试状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AIChannel'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
    delete:
      tags: [configuration]
      operationId: deleteAIChannel
      parameters:
        - {$ref: '#/components/parameters/AIChannelId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      responses:
        '204': {description: 已物理删除渠道、Header 和模型}
  /api/v1/ai-channels/{channel_id}/api-key:
    put:
      tags: [configuration]
      operationId: replaceAIChannelApiKey
      parameters:
        - {$ref: '#/components/parameters/AIChannelId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
