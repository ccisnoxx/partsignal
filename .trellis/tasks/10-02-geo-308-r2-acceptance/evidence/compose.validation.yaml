name: partsignal-geo308-validation
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: partsignal
      POSTGRES_USER: partsignal
      POSTGRES_PASSWORD: geo308-local-test-only
    ports: ['127.0.0.1:55458:5432']
    healthcheck:
      test: [CMD-SHELL, pg_isready -U partsignal -d partsignal]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports: ['127.0.0.1:56398:6379']
  fake-oss:
    build:
      context: /Users/sc/PycharmProjects/partsignal/backend
      target: test
    environment:
      APP_ENV: test
      OBJECT_STORAGE_PATH: /data
      OBJECT_STORAGE_ENDPOINT: http://fake-oss:9000
    command: [python, -m, app.files.fake_server]
  backend-test:
    build:
      context: /Users/sc/PycharmProjects/partsignal/backend
      target: test
    volumes:
      - /Users/sc/PycharmProjects/partsignal/backend:/app
      - /Users/sc/PycharmProjects/partsignal/contracts:/contracts:ro
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://partsignal:geo308-local-test-only@postgres:5432/partsignal
      REDIS_URL: redis://redis:6379/15
      SESSION_SECRET: geo308-test-session-at-least-32-bytes
      PARTSIGNAL_SEED_ADMIN_PASSWORD: partsignal-admin-dev
      PARTSIGNAL_SEED_ENGINEER_PASSWORD: partsignal-engineer-dev
      CONTENT_GENERATOR: openai-compatible
      AI_CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      AI_ALLOW_LOCAL_HTTP: 'true'
      OBJECT_STORAGE_BACKEND: development
      OBJECT_STORAGE_ENDPOINT: http://fake-oss:9000
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      fake-oss: {condition: service_started}
    command: [pytest, tests/integration]
