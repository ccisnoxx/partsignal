name: visual-baselines

on:
  workflow_dispatch:
  push:
    branches: [agent/mvp]
    paths: [.github/workflows/visual-baselines.yml]

jobs:
  generate-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - name: Generate Linux visual baselines
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:5173 >/dev/null && break
            test "$attempt" -lt 30
            sleep 1
          done
          npx playwright test tests/e2e/visual-regression.spec.ts --update-snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: frontend/tests/e2e/visual-regression.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
