services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: partsignal
      POSTGRES_USER: partsignal
      POSTGRES_PASSWORD: partsignal_dev
    healthcheck:
      test: [CMD-SHELL, pg_isready -U partsignal -d partsignal]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes: [geo701-postgres:/var/lib/postgresql/data]
  redis:
    image: redis:7.4-alpine
  fake-oss:
    image: geo607-validation-backend-test:latest
    command: [python, -m, app.files.fake_server]
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://partsignal:partsignal_dev@postgres:5432/partsignal
      REDIS_URL: redis://redis:6379/15
      OBJECT_STORAGE_PATH: /tmp/geo607-storage
    tmpfs: [/tmp/geo607-storage]
  backend-test:
    image: geo607-validation-backend-test:latest
    build:
      context: ../../../../backend
      target: test
    volumes:
      - ../../../../backend:/app
      - ../../../../contracts:/contracts:ro
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://partsignal:partsignal_dev@postgres:5432/partsignal
      REDIS_URL: redis://redis:6379/15
      SESSION_SECRET: test-session-secret-at-least-32-bytes
      PARTSIGNAL_SEED_ADMIN_PASSWORD: partsignal-admin-dev
      PARTSIGNAL_SEED_ENGINEER_PASSWORD: partsignal-engineer-dev
      CONTENT_GENERATOR: openai-compatible
      AI_CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      AI_ALLOW_LOCAL_HTTP: 'true'
      OBJECT_STORAGE_BACKEND: development
      OBJECT_STORAGE_ENDPOINT: http://fake-oss:9000
    command: [pytest, tests/integration]
    profiles: [test]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      fake-oss:
        condition: service_started
volumes:
  geo701-postgres:
