# 当前 Production 原地接管既有运行时；历史项目标识保留到独立迁移窗口。
name: partsignal-staging

x-backend: &backend
  image: ${PARTSIGNAL_BACKEND_IMAGE:?必须指定 PARTSIGNAL_BACKEND_IMAGE}:${PARTSIGNAL_VERSION:?必须指定 PARTSIGNAL_VERSION}
  env_file:
    - ${PARTSIGNAL_RUNTIME_ENV_FILE:?必须指定 PARTSIGNAL_RUNTIME_ENV_FILE}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [partsignal-internal, partsignal-egress]
  read_only: true
  tmpfs:
    - /tmp:size=64m,noexec,nosuid
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    restart: 'no'

  api:
    <<: *backend
    command: [uvicorn, 'app.main:app', --host, 0.0.0.0, --port, '8000', --timeout-keep-alive, '35', --workers, '2']
    ports:
      - 127.0.0.1:19000:8000
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    <<: *backend
    profiles: [production-async]
    command: [celery, -A, 'app.worker:celery_app', worker, --loglevel=INFO, --concurrency=1, --pidfile=/tmp/partsignal-worker.pid]
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: [CMD, python, -c, "import os, pathlib; os.kill(int(pathlib.Path('/tmp/partsignal-worker.pid').read_text()), 0)"]
      interval: 10s
      timeout: 3s
      retries: 12

  scheduler:
    <<: *backend
    profiles: [production-async]
    command: [celery, -A, 'app.worker:celery_app', beat, --loglevel=INFO, --schedule, /tmp/partsignal-celerybeat, --pidfile=/tmp/partsignal-beat.pid]
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.25
    healthcheck:
      test: [CMD, python, -c, "import os, pathlib; os.kill(int(pathlib.Path('/tmp/partsignal-beat.pid').read_text()), 0)"]
      interval: 10s
      timeout: 3s
      retries: 12

  frontend:
    image: ${PARTSIGNAL_FRONTEND_IMAGE:?必须指定 PARTSIGNAL_FRONTEND_IMAGE}:${PARTSIGNAL_FRONTEND_VERSION:-${PARTSIGNAL_VERSION}}
    ports:
      - 127.0.0.1:19080:80
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,noexec,nosuid
      - /var/run:size=4m,noexec,nosuid
    mem_limit: 96m
    cpus: 0.25
    networks: [partsignal-edge]
    logging: *logging

  postgres:
    image: postgres:16-alpine
    env_file:
      - ${PARTSIGNAL_RUNTIME_ENV_FILE}
    volumes:
      - ${PARTSIGNAL_DATA_ROOT:?必须指定 PARTSIGNAL_DATA_ROOT}/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [partsignal-internal]
    logging: *logging

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory, 96mb, --maxmemory-policy, noeviction]
    volumes:
      - ${PARTSIGNAL_DATA_ROOT:?必须指定 PARTSIGNAL_DATA_ROOT}/redis:/data
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [partsignal-internal]
    logging: *logging

networks:
  partsignal-internal:
    name: partsignal-staging-internal
    internal: true
  partsignal-egress:
    name: partsignal-staging-egress
  partsignal-edge:
    name: partsignal-staging-edge
