openapi: 3.1.0
info:
  title: PartSignal API
  version: 0.1.1
  description: PartSignal MVP 契约。除登录外，写请求必须携带 X-CSRF-Token。
servers:
  - url: /
security:
  - sessionCookie: []
tags:
  - name: health
  - name: auth
  - name: identity
  - name: product-facts
  - name: planning
  - name: production
  - name: review
  - name: publication
  - name: observation
  - name: files
  - name: configuration
  - name: geo-catalog
  - name: geo-surface-management
paths:
  /api/v1/geo/subjects:
    get:
      tags:
      - geo-catalog
      operationId: listGeoSubjects
      security:
      - sessionCookie: []
      x-required-account-types:
      - ADMIN
      - ENGINEER
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - name: q
        in: query
        schema:
          type: string
          maxLength: 240
      - name: subject_type
        in: query
        schema:
          $ref: '#/components/schemas/GeoSubjectType'
      - name: product_id
        in: query
        schema:
          type: string
          format: uuid
      - name: parent_subject_id
        in: query
        schema:
          type: string
          format: uuid
      - name: is_active
        in: query
        schema:
          type: boolean
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - NAME_ASC
          - UPDATED_DESC
          default: NAME_ASC
      - $ref: '#/components/parameters/Page'
      - name: page_size
        in: query
        schema:
          type: integer
          enum:
          - 10
          - 20
          - 50
          default: 20
      responses:
        '200':
          description: Subject 聚合当前投影
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIdResponseHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoSubjectListPage'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
      x-error-codes:
        '400':
        - VALIDATION_ERROR
        '401':
        - AUTH_REQUIRED
        '403':
        - PASSWORD_CHANGE_REQUIRED
        '422':
        - VALIDATION_ERROR
    post:
      tags:
      - geo-catalog
      operationId: createGeoSubject
      security:
      - sessionCookie: []
      x-required-account-types:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '201':
          description: Subject 聚合当前投影
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIdResponseHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoSubjectOut'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
      x-error-codes:
        '400':
        - VALIDATION_ERROR
        '401':
        - AUTH_REQUIRED
        '403':
        - PASSWORD_CHANGE_REQUIRED
        - PERMISSION_DENIED
        - CSRF_INVALID
        '422':
        - VALIDATION_ERROR
        '404':
        - NOT_FOUND
        '409':
        - GEO_SUBJECT_PRODUCT_EXISTS
        - GEO_SUBJECT_PARENT_INVALID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoSubjectCreate'
  /api/v1/geo/subjects/{subject_id}:
    get:
      tags:
      - geo-catalog
      operationId: getGeoSubject
      security:
      - sessionCookie: []
      x-required-account-types:
      - ADMIN
      - ENGINEER
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - name: subject_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Subject 聚合当前投影
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIdResponseHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoSubjectOut'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      x-error-codes:
        '400':
        - VALIDATION_ERROR
        '401':
        - AUTH_REQUIRED
        '403':
        - PASSWORD_CHANGE_REQUIRED
        '422':
        - VALIDATION_ERROR
        '404':
        - NOT_FOUND
    patch:
      tags:
      - geo-catalog
      operationId: updateGeoSubject
      security:
      - sessionCookie: []
      x-required-account-types:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - name: subject_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Subject 聚合当前投影
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIdResponseHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoSubjectOut'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
      x-error-codes:
        '400':
        - VALIDATION_ERROR
        '401':
        - AUTH_REQUIRED
        '403':
        - PASSWORD_CHANGE_REQUIRED
        - PERMISSION_DENIED
        - CSRF_INVALID
        '422':
        - VALIDATION_ERROR
        '404':
        - NOT_FOUND
        '409':
        - REVISION_CONFLICT
        - GEO_SUBJECT_PARENT_INVALID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoSubjectUpdate'
    delete:
      tags:
      - geo-catalog
      operationId: deleteGeoSubject
      security:
      - sessionCookie: []
      x-required-account-types:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - name: subject_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CsrfHeader'
      - name: expected_revision
        in: query
        required: true
        schema:
          type: integer
          minimum: 0
      responses:
        '204':
          description: 删除完成
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIdResponseHeader'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
      x-error-codes:
        '400':
        - VALIDATION_ERROR
        '401':
        - AUTH_REQUIRED
        '403':
        - PASSWORD_CHANGE_REQUIRED
        - PERMISSION_DENIED
        - CSRF_INVALID
        '422':
        - VALIDATION_ERROR
        '404':
        - NOT_FOUND
        '409':
        - REVISION_CONFLICT
        - GEO_SUBJECT_IN_USE
      description: expected_revision 是父 Subject revision；Subject 删除复核真实直接引用；子删除只移除当前字典，不改写历史。
