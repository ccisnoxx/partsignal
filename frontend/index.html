<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F7FC" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>PartSignal · GEO 内容运营</title>
    <script>
      (() => {
        const storageKey = 'partsignal.theme-mode';
        const validModes = ['light', 'dark', 'system'];
        let mode = 'system';
        try {
          const stored = localStorage.getItem(storageKey);
          if (validModes.includes(stored)) mode = stored;
          else if (stored !== null) localStorage.removeItem(storageKey);
        } catch (error) {
          console.warn('无法读取主题偏好，本次会话将跟随系统主题。', error);
        }
        const resolved = mode === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : mode;
        const canvas = resolved === 'dark' ? '#111827' : '#F4F7FC';
        document.documentElement.dataset.themeMode = mode;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
        document.documentElement.style.backgroundColor = canvas;
        document.querySelector('meta[name="theme-color"]').content = canvas;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
