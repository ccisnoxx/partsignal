name: ci

on:
  workflow_dispatch:
    inputs:
      checks_group:
        description: 'full 全量；delivery 仅构建、部署检查及 E2E，不作为全量通过证明'
        type: choice
        required: true
        default: full
        options: [full, delivery]

jobs:
  verify:
    name: verify (${{ inputs.checks_group || 'full' }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: partsignal_test
          POSTGRES_USER: partsignal
          POSTGRES_PASSWORD: partsignal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partsignal -d partsignal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://partsignal:partsignal_test@localhost:5432/partsignal_test
      REDIS_URL: redis://localhost:6379/15
      SESSION_SECRET: ci-session-secret-at-least-32-bytes
      # 成功路径使用本地协议替身；关闭模式由专门测试显式覆盖。
      CONTENT_GENERATOR: openai-compatible
      OBJECT_STORAGE_BACKEND: development
      OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:19009
      PARTSIGNAL_SEED_ADMIN_PASSWORD: partsignal-admin-dev
      PARTSIGNAL_SEED_ENGINEER_PASSWORD: partsignal-engineer-dev
      # Browser合同在仅回环的独立容器内运行；下载依赖不属于平台采集。
      GEO_BROWSER_CONTRACT_CONTAINER: '1'
    steps:
      - name: 核对验证范围
        env:
          CHECKS_GROUP: ${{ inputs.checks_group || 'full' }}
        run: |
          case "$CHECKS_GROUP" in
            full) echo '全量 CI' ;;
            delivery) echo '定向 delivery CI；不表示全量检查通过' ;;
            *) echo '拒绝未知验证范围' >&2; exit 2 ;;
          esac
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --project backend --all-extras
      - run: npm ci --prefix frontend
      - run: npm ci --prefix browser-collector
      - run: cp .env.example .env
      - run: uv run --project backend alembic -c backend/alembic.ini upgrade head
      - if: ${{ inputs.checks_group != 'delivery' }}
        run: make contract-check
      - if: ${{ inputs.checks_group != 'delivery' }}
        run: make lint
      - if: ${{ inputs.checks_group != 'delivery' }}
        run: make typecheck
      - if: ${{ inputs.checks_group != 'delivery' }}
        run: uv run --project backend pytest backend/tests/unit
      - if: ${{ inputs.checks_group != 'delivery' }}
        run: npm --prefix frontend run test
      # 复用权威入口：容器提供合同挂载和对象存储，恢复测试必跑显式 PG16 工具。
      - if: ${{ inputs.checks_group != 'delivery' }}
        run: make test-integration
      - run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - run: make build test-deploy-scripts
      - run: make e2e
        env:
          REDIS_URL: redis://localhost:6379/14
      - run: docker compose --env-file .env.example -f deploy/compose.dev.yaml config --quiet
      - run: docker compose --env-file .env.example -f deploy/compose.prod.yaml config --quiet
        env:
          PARTSIGNAL_BACKEND_IMAGE: partsignal-backend
          PARTSIGNAL_FRONTEND_IMAGE: partsignal-frontend-v2
          PARTSIGNAL_VERSION: test
          PARTSIGNAL_RUNTIME_ENV_FILE: ${{ github.workspace }}/.env.example
          PARTSIGNAL_DATA_ROOT: ${{ runner.temp }}/partsignal-data

  frontend-test:
    if: ${{ inputs.checks_group != 'delivery' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm exec -- vitest run --shard=${{ matrix.shard }}/2 --maxWorkers=1
        working-directory: frontend
