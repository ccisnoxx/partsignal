  /api/health/live:
    get:
      tags: [health]
      operationId: getLiveHealth
      parameters: [{$ref: '#/components/parameters/RequestIdHeader'}]
      security: []
      responses:
        '200':
          description: 进程存活
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestIdResponseHeader'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
  /api/health/ready:
    get:
      tags: [health]
      operationId: getReadyHealth
      parameters: [{$ref: '#/components/parameters/RequestIdHeader'}]
      security: []
      responses:
        '200':
          description: PostgreSQL 和 Redis 就绪
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestIdResponseHeader'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      parameters: [{$ref: '#/components/parameters/RequestIdHeader'}]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: 登录成功并设置会话 Cookie
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestIdResponseHeader'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSession'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}, {$ref: '#/components/parameters/RequestIdHeader'}]
      responses:
        '204':
          description: 已撤销会话
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestIdResponseHeader'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      parameters: [{$ref: '#/components/parameters/RequestIdHeader'}]
      responses:
        '200':
          description: 当前用户
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestIdResponseHeader'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '204':
          description: 当前无会话
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestIdResponseHeader'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/auth/session:
    get:
      tags: [auth]
      operationId: getAuthSession
      security: [{sessionCookie: []}, {}]
      parameters: [{$ref: '#/components/parameters/RequestIdHeader'}]
      responses:
        '200':
          description: 同一次服务端会话解析形成的当前用户、CSRF Token 与公开不透明 session binding
          headers:
