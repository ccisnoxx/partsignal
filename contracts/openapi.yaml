        by_status: {$ref: '#/components/schemas/GeoInsightCoverageCounts'}
        matrix: {type: array, items: {$ref: '#/components/schemas/GeoInsightCoverageItem'}}
    GeoInsightRecommendationBasis:
      type: object
      additionalProperties: false
      required: [metric, value, threshold, unit]
      properties:
        metric: {type: string, enum: [unmentioned_days, discovery_rate, mention_rate, accuracy_rate, observation_count, coverage_rate]}
        value: {type: [number, 'null']}
        threshold: {type: [number, 'null']}
        unit: {type: string, enum: [RATIO, PERCENTAGE_POINT, COUNT, DAY]}
    GeoInsightRecommendation:
      type: object
      additionalProperties: false
      required: [rule_code, priority, title, basis_text, basis_values, impact_relationship_count, published_article_ids, geo_platforms, query_topic_ids, detail_path]
      properties:
        rule_code: {type: string, enum: [CONTENT_LONG_UNMENTIONED, CONTENT_PERFORMANCE_DECLINE, GEO_PLATFORM_PERFORMANCE_DECLINE, CONTENT_NEVER_DISCOVERED, QUESTION_UNCOVERED, QUESTION_OCCASIONAL, QUESTION_INSUFFICIENT_DATA]}
        priority: {type: string, enum: [HIGH, MEDIUM, LOW]}
        title: {type: string}
        basis_text: {type: string}
        basis_values: {type: array, items: {$ref: '#/components/schemas/GeoInsightRecommendationBasis'}}
        impact_relationship_count: {type: integer, minimum: 0}
        published_article_ids: {type: array, items: {type: string, format: uuid}}
        geo_platforms: {type: array, items: {type: string}}
        query_topic_ids: {type: array, items: {type: string, format: uuid}}
        detail_path: {type: [string, 'null']}
    GeoInsightUnavailableSection:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {type: string, enum: [NO_COMPLETE_OBSERVATIONS, NO_COMPLETE_PREVIOUS_OBSERVATIONS, NO_GEO_PLATFORMS, LONG_UNMENTIONED_PERIOD_TOO_SHORT]}
        message: {type: string}
    GeoInsightDataQuality:
      type: object
      additionalProperties: false
      required: [eligible_observation_count, excluded_incomplete_observation_count, excluded_incomplete_relation_count, unavailable_sections]
      properties:
        eligible_observation_count: {type: integer, minimum: 0}
        excluded_incomplete_observation_count: {type: integer, minimum: 0}
        excluded_incomplete_relation_count: {type: integer, minimum: 0}
        unavailable_sections: {type: array, items: {$ref: '#/components/schemas/GeoInsightUnavailableSection'}}
    GeoInsights:
      type: object
      additionalProperties: false
      required: [generated_at, analysis_unit, period, filter_options, trends, platform_performance, content_rankings, question_coverage, recommendations, data_quality]
      properties:
        generated_at: {type: string, format: date-time}
        analysis_unit: {type: string, const: MANUAL_OBSERVATION_PUBLICATION_RELATION, description: 独立发现率、提及率、准确率、平台率和内容排行统一使用当前链尾人工观测与逐篇发布内容关系作为基础单位}
        period: {$ref: '#/components/schemas/GeoInsightPeriod'}
        filter_options: {$ref: '#/components/schemas/GeoInsightFilterOptions'}
        trends: {$ref: '#/components/schemas/GeoInsightTrends'}
        platform_performance: {type: array, items: {$ref: '#/components/schemas/GeoInsightPlatformPerformance'}}
        content_rankings: {$ref: '#/components/schemas/GeoInsightContentRankings'}
        question_coverage: {$ref: '#/components/schemas/GeoInsightQuestionCoverage'}
        recommendations: {type: array, items: {$ref: '#/components/schemas/GeoInsightRecommendation'}}
        data_quality: {$ref: '#/components/schemas/GeoInsightDataQuality'}
    DashboardSummary:
      type: object
      additionalProperties: false
      required: [pending_fact_reviews, pending_content_reviews, pending_publications, open_publication_issues, recent_accuracy_errors]
      properties:
        pending_fact_reviews: {type: integer, minimum: 0}
        pending_content_reviews: {type: integer, minimum: 0}
        pending_publications: {type: integer, minimum: 0}
        open_publication_issues: {type: integer, minimum: 0}
        recent_accuracy_errors: {type: integer, minimum: 0}
    FileCategory: {type: string, enum: [EVIDENCE, OPERATION_SCREENSHOT, PUBLICATION_ASSET, PLATFORM_LOGO]}
    UploadIntentCreate:
      type: object
      additionalProperties: false
      required: [category, original_filename, content_type, size, sha256, access_level]
      properties:
        category: {$ref: '#/components/schemas/FileCategory'}
        original_filename: {type: string}
        content_type: {type: string}
        size: {type: integer, minimum: 1}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        access_level: {$ref: '#/components/schemas/Confidentiality'}
    UploadInstruction:
      type: object
      additionalProperties: false
      required: [method, url, headers, fields, expires_at]
      properties:
        method: {type: string, enum: [PUT, POST]}
        url: {type: string, format: uri, minLength: 1, maxLength: 2083}
        headers: {type: object, additionalProperties: {type: string}}
        fields: {type: object, additionalProperties: {type: string}}
        expires_at: {type: string, format: date-time}
    UploadIntent:
      type: object
      additionalProperties: false
      required: [file, upload]
      properties:
        file: {$ref: '#/components/schemas/FileRecord'}
        upload: {$ref: '#/components/schemas/UploadInstruction'}
    FileRecord:
      type: object
      additionalProperties: false
      required: [id, category, original_filename, object_key, content_type, size, sha256, access_level, status, created_at]
      properties:
        id: {type: string, format: uuid}
        category: {$ref: '#/components/schemas/FileCategory'}
        original_filename: {type: string}
        object_key: {type: string}
        content_type: {type: string}
        size: {type: integer}
        sha256: {type: string}
        access_level: {$ref: '#/components/schemas/Confidentiality'}
        status: {type: string, enum: [PENDING, VERIFIED, FAILED, ABORTED, DELETING, DELETED]}
        created_at: {type: string, format: date-time}
        verified_at: {type: [string, 'null'], format: date-time}
    SignedUrl:
      type: object
      additionalProperties: false
      required: [url, expires_at]
      properties:
        url: {type: string, format: uri, minLength: 1, maxLength: 2083}
        expires_at: {type: string, format: date-time}
