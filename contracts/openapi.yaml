        declining: {type: array, items: {$ref: '#/components/schemas/GeoInsightDecliningContent'}}
        long_unmentioned: {type: array, items: {$ref: '#/components/schemas/GeoInsightLongUnmentionedContent'}}
    GeoInsightCoverageCounts:
      type: object
      additionalProperties: false
      required: [stable, occasional, uncovered, insufficient_data]
      properties:
        stable: {type: integer, minimum: 0}
        occasional: {type: integer, minimum: 0}
        uncovered: {type: integer, minimum: 0}
        insufficient_data: {type: integer, minimum: 0}
    GeoInsightCoverageItem:
      type: object
      additionalProperties: false
      required: [query_topic_id, canonical_question, geo_platform, status, observation_count, mentioned_observation_count, coverage_rate, primary_task, optimization_action]
      properties:
        query_topic_id: {type: string, format: uuid}
        canonical_question: {type: string}
        geo_platform: {type: string}
        status: {type: string, enum: [STABLE, OCCASIONAL, UNCOVERED, INSUFFICIENT_DATA]}
        observation_count: {type: integer, minimum: 0}
        mentioned_observation_count: {type: integer, minimum: 0}
        coverage_rate: {$ref: '#/components/schemas/GeoInsightRateValue'}
        primary_task: {type: string, enum: [VIEW_OBSERVATION_DETAILS, CREATE_OPTIMIZATION_TASK, ADD_OBSERVATION]}
