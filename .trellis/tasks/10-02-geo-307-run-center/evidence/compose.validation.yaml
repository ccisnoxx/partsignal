name: partsignal-geo307-validation
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: partsignal
      POSTGRES_USER: partsignal
      POSTGRES_PASSWORD: geo307-local-test-only
    ports: ['127.0.0.1:55457:5432']
    volumes: [geo307-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U partsignal -d partsignal]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports: ['127.0.0.1:56397:6379']
volumes:
  geo307-postgres:
