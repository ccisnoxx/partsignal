        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
      description: 管理员固定连接及 answer_text 能力诊断。先预留 revision 并停用，事务外 pinned 出网，完成时重验依赖版本；不创建业务 Run，成功不自动启用。provider
        失败以安全 test_error 和 FAILED 返回200，过期结果409。诊断仅支持 openai-compatible-chat，采集仍未批准。
  /api/v1/geo/observation-runs/{run_id}/retry:
    post:
      tags:
      - geo-run-commands
      summary: Retry Geo Observation Run
      operationId: retryGeoObservationRun
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 32
          title: X-Csrf-Token
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '201':
          description: Successful Response
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIdResponseHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoRunRetryCreated'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoRunRetryRequest'
      x-required-account-types:
      - ADMIN
      - ENGINEER
      description: 显式追加同输入采集 attempt；required expected_revision。原尝试不变，已有后继返回409 GEO_RUN_HAS_SUCCESSOR；无自动命令重放。提交后投递稳定Run
        ID，Broker失败由PENDING扫描恢复。
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: partsignal_session
  parameters:
    RequestIdHeader:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 100
        pattern: '^[\x20-\x7E]+$'
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string, minLength: 32}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: page_size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    ProductId: {name: product_id, in: path, required: true, schema: {type: string, format: uuid}}
    FactVersionId: {name: fact_version_id, in: path, required: true, schema: {type: string, format: uuid}}
    PlatformProfileId: {name: platform_profile_id, in: path, required: true, schema: {type: string, format: uuid}}
    PlatformTypeId: {name: platform_type_id, in: path, required: true, schema: {type: string, format: uuid}}
    AIChannelId: {name: channel_id, in: path, required: true, schema: {type: string, format: uuid}}
    AIChannelHeaderId: {name: header_id, in: path, required: true, schema: {type: string, format: uuid}}
    AIModelId: {name: model_id, in: path, required: true, schema: {type: string, format: uuid}}
    ContentTaskId: {name: content_task_id, in: path, required: true, schema: {type: string, format: uuid}}
    GenerationJobId: {name: generation_job_id, in: path, required: true, schema: {type: string, format: uuid}}
    ContentVersionId: {name: content_version_id, in: path, required: true, schema: {type: string, format: uuid}}
    FileId: {name: file_id, in: path, required: true, schema: {type: string, format: uuid}}
  headers:
    RequestIdResponseHeader:
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
        pattern: '^[\x20-\x7E]+$'
  requestBodies:
    CommandRequest:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CommandRequest'}
    RequestChangesCommand:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RequestChangesCommand'}
    RevisionRequest:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RevisionRequest'}
  responses:
    ErrorResponse:
      description: 业务或校验错误
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestIdResponseHeader'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    FactVersionResponse:
      description: 更新后的事实版本
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestIdResponseHeader'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/FactVersion'}
    ContentVersionResponse:
      description: 更新后的内容版本
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestIdResponseHeader'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ContentVersion'}
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [ok]}
        checks: {type: [object, 'null'], additionalProperties: {type: string}}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: {$ref: '#/components/schemas/ErrorDetail'}
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, details, request_id]
      properties:
        code: {type: string}
        message: {type: string}
        details: {type: object, additionalProperties: true, default: {}}
        request_id: {type: string}
    PageInfo:
      type: object
      additionalProperties: false
      required: [page, page_size, total]
      properties:
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 1}
        password: {type: string, minLength: 8}
    AuthSession:
      type: object
      additionalProperties: false
      required: [user, csrf_token, session_binding]
      properties:
        user: {$ref: '#/components/schemas/User'}
        csrf_token: {type: string, minLength: 1, maxLength: 256}
        session_binding:
          type: string
          minLength: 64
          maxLength: 64
          pattern: '^[0-9a-f]{64}$'
          description: 由服务端 session identity 单向推导的公开不透明绑定；不能用于认证或 CSRF
    CsrfToken:
      type: object
      additionalProperties: false
      required: [csrf_token]
      properties:
        csrf_token: {type: string, minLength: 1, maxLength: 256}
    AccountType:
      type: string
      enum: [ADMIN, ENGINEER]
    UserStatus:
      type: string
      enum: [ENABLED, DISABLED]
    DeletionBlockerType:
      type: string
      enum: [FACT_VERSION, CONTENT_TASK, GEO_OBSERVATION, GEO_SUBJECT, GEO_PROMPT_VARIANT, CONTENT_VERSION, GENERATION_JOB, PUBLISHED_ARTICLE, PLATFORM_PROFILE, PLATFORM_ACCOUNT, PUBLICATION_WORK, PROTECTED_CONTENT_VERSION, PUBLISHED_CONTENT_ISSUE, GEO_OPTIMIZATION_SOURCE, USER_BUSINESS_HISTORY]
    DeletionBlocker:
      type: object
      additionalProperties: false
      required: [type, count]
      properties:
        type: {$ref: '#/components/schemas/DeletionBlockerType'}
        count: {type: integer, minimum: 1}
    DeletionProjection:
      type: object
      additionalProperties: false
      required: [blockers]
      properties:
        blockers:
          type: array
          items: {$ref: '#/components/schemas/DeletionBlocker'}
    User:
      type: object
      additionalProperties: false
      required: [id, username, display_name, account_type, is_active, must_change_password, workflow_stage, primary_task, available_actions, deletion, revision, created_at]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        display_name: {type: string}
        account_type: {$ref: '#/components/schemas/AccountType'}
        is_active: {type: boolean}
        must_change_password: {type: boolean}
        workflow_stage: {type: string, enum: [FIRST_PASSWORD_CHANGE, ACTIVE, DISABLED]}
        primary_task: {type: string, enum: [MANAGE_LOGIN_SECURITY, MANAGE_USER, ENABLE_USER]}
        available_actions:
          type: array
          items: {type: string, enum: [UPDATE, RESET_PASSWORD, ENABLE, DISABLE, DELETE]}
        deletion:
          anyOf:
            - {$ref: '#/components/schemas/DeletionProjection'}
            - {type: 'null'}
        revision: {type: integer}
        created_at: {type: string, format: date-time}
    UserCreate:
      type: object
      additionalProperties: false
      required: [username, display_name, temporary_password, account_type]
      properties:
        username: {type: string, minLength: 3}
        display_name: {type: string, minLength: 1}
        temporary_password: {type: string, minLength: 12, description: 仅用于本次创建请求；服务端只保存哈希并强制首次登录改密}
        account_type: {$ref: '#/components/schemas/AccountType'}
    UserUpdate:
      type: object
      additionalProperties: false
      required: [expected_revision, display_name, account_type, is_active]
      properties:
        expected_revision: {type: integer, minimum: 0}
        display_name: {type: string, minLength: 1}
        account_type: {$ref: '#/components/schemas/AccountType'}
        is_active: {type: boolean}
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [temporary_password, expected_revision]
      properties:
        temporary_password: {type: string, minLength: 8}
        expected_revision: {type: integer, minimum: 0}
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [old_password, new_password]
      properties:
        old_password: {type: string, minLength: 8}
        new_password: {type: string, minLength: 8}
    UserSummary:
      type: object
      additionalProperties: false
      required: [user_total, enabled_total, disabled_total, must_change_password_total, admin_total]
      properties:
        user_total: {type: integer, minimum: 0}
        enabled_total: {type: integer, minimum: 0}
        disabled_total: {type: integer, minimum: 0}
        must_change_password_total: {type: integer, minimum: 0}
        admin_total: {type: integer, minimum: 0}
    UserList:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total, summary]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/User'}}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer}
        summary: {$ref: '#/components/schemas/UserSummary'}
    UserBulkStatusItem:
      type: object
      additionalProperties: false
      required: [user_id, expected_revision]
      properties:
        user_id: {type: string, format: uuid}
        expected_revision: {type: integer, minimum: 0}
    UserBulkStatusRequest:
      type: object
      additionalProperties: false
      required: [items, status]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          description: user_id 必须唯一
          items: {$ref: '#/components/schemas/UserBulkStatusItem'}
        status: {$ref: '#/components/schemas/UserStatus'}
    UserBulkStatusFailure:
      type: object
      additionalProperties: false
      required: [user_id, code, message]
      properties:
        user_id: {type: string, format: uuid}
        code: {type: string, enum: [NOT_FOUND, REVISION_CONFLICT, LAST_ADMIN_REQUIRED, INVALID_STATE_TRANSITION]}
        message: {type: string}
    UserBulkStatusResult:
      type: object
      additionalProperties: false
      required: [succeeded, failures]
      properties:
        succeeded: {type: array, items: {$ref: '#/components/schemas/User'}}
        failures: {type: array, items: {$ref: '#/components/schemas/UserBulkStatusFailure'}}
    AuditModule:
      type: string
      enum:
        - IDENTITY
        - PRODUCT_FACTS
        - CONTENT_PLANNING
        - CONTENT_PRODUCTION
        - CONTENT_REVIEW
        - PUBLICATION
        - GEO_OBSERVATION
        - CONFIGURATION
        - FILE_MANAGEMENT
    AuditOutcome: {type: string, enum: [SUCCESS, FAILED, DENIED]}
    AuditActor:
      type: object
      additionalProperties: false
      required: [id, display_name, account_type]
      properties:
        id: {type: string, format: uuid}
        display_name: {type: string}
        account_type: {$ref: '#/components/schemas/AccountType'}
    AuditSafeScalar:
      anyOf:
        - {type: string}
        - {type: number}
        - {type: integer}
        - {type: boolean}
        - {type: 'null'}
    AuditSafeValue:
      anyOf:
        - {$ref: '#/components/schemas/AuditSafeScalar'}
        - type: array
          items: {$ref: '#/components/schemas/AuditSafeScalar'}
    AuditChange:
      type: object
      additionalProperties: false
      required: [field]
      properties:
        field: {type: string}
        before: {$ref: '#/components/schemas/AuditSafeValue'}
        after: {$ref: '#/components/schemas/AuditSafeValue'}
    AuditRelatedEntry:
      type: object
      additionalProperties: false
      required: [status, kind, parent_id]
      properties:
        status: {type: string, enum: [AVAILABLE, MISSING, UNSUPPORTED]}
        kind: {type: [string, 'null']}
        parent_id: {type: [string, 'null']}
    AuditLog:
      type: object
      additionalProperties: false
      required: [id, actor_id, actor, business_module, action, target_type, target_id, outcome, primary_task, request_id, created_at]
      properties:
        id: {type: string, format: uuid}
        actor_id: {type: [string, 'null'], format: uuid}
        actor:
          anyOf:
            - {$ref: '#/components/schemas/AuditActor'}
            - {type: 'null'}
        business_module: {$ref: '#/components/schemas/AuditModule'}
        action: {type: string}
        target_type: {type: string}
        target_id: {type: [string, 'null']}
        outcome: {$ref: '#/components/schemas/AuditOutcome'}
        primary_task: {type: string, const: VIEW_LOG_DETAIL}
        request_id: {type: string}
        created_at: {type: string, format: date-time}
    AuditLogList:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AuditLog'}}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer}
    AuditLogDetail:
      type: object
      additionalProperties: false
      required: [id, actor_id, actor, business_module, action, target_type, target_id, outcome, primary_task, request_id, created_at, changes, facts, result_message, error_code, related_entry]
      properties:
        id: {type: string, format: uuid}
        actor_id: {type: [string, 'null'], format: uuid}
        actor:
          anyOf:
